group 'io.agora.agora_rtc_engine'
version '1.0-SNAPSHOT'

def safeExtGet(prop, fallback) {
  rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}

buildscript {
  ext.agora_rtc_engine_kt_version = '1.8.22'
  def kotlin_version = rootProject.ext.has('kotlin_version') ? rootProject.ext.get('kotlin_version') : "$agora_rtc_engine_kt_version"

  repositories {
    mavenCentral()
    google()
  }

  dependencies {
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
  }
}

rootProject.allprojects {
  repositories {
    mavenCentral()
    google()
  }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
  // Conditional for compatibility with AGP <4.2.
  if (project.android.hasProperty("namespace")) {
    namespace 'io.agora.agora_rtc_engine'
  }
  compileSdkVersion safeExtGet('compileSdkVersion', 31)

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_11
    targetCompatibility JavaVersion.VERSION_11
  }

  kotlinOptions {
    jvmTarget = JavaVersion.VERSION_11.toString()
  }

  defaultConfig {
    minSdkVersion safeExtGet('minSdkVersion', 16)

    consumerProguardFiles 'consumer-rules.pro'
  }

  sourceSets {
    main.java.srcDirs += 'src/main/kotlin'

    if (isDev(project)) {
      main.jniLibs.srcDirs += 'libs'
    }
  }
}

dependencies {
  if (isDev(project)) {
    api fileTree(dir: "libs", include: ["*.jar", "*.aar"])
  } else {
    // native dependencies start
    api 'io.agora.rtc:agora-special-voice:3.7.3.5'
    // native dependencies end

    // iris dependencies start
    api 'io.agora.rtc:iris-rtc:3.7.3.5'
    // iris dependencies end
  }

  // implementation 'io.agora.rtc:full-screen-sharing:3.7.3.5'

  implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:${safeExtGet('kotlin_version', "$agora_rtc_engine_kt_version")}"
}

static boolean isDev(Project project) {
  def devFile = project.file('.plugin_dev')
  return devFile.exists()
}
