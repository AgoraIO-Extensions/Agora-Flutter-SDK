name: 'run: Apple dependency matrix'

on:
  workflow_call:
    inputs:
      target_branch:
        description: 'Branch to build; empty uses the caller commit'
        type: string
        required: false
        default: ''
      flutter_version:
        description: 'Flutter version'
        type: string
        required: false
        default: '3.44.4'
  workflow_dispatch:
    inputs:
      target_branch:
        description: 'Branch to build'
        type: string
        required: true
        default: 'release/6.5'
      flutter_version:
        description: 'Flutter version'
        type: string
        required: true
        default: '3.44.4'

jobs:
  build:
    name: ${{ matrix.platform }} dependency linkage - agora_rtc_engine-${{ matrix.dependency_manager }}-iris_method_channel-${{ matrix.dependency_manager }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ios
            dependency_manager: cocoapods
          - platform: macos
            dependency_manager: cocoapods
          - platform: ios
            dependency_manager: swiftpm
          - platform: macos
            dependency_manager: swiftpm
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - name: Checkout as agora_rtc_engine
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_branch || github.sha }}
          path: agora_rtc_engine
          fetch-depth: '1'
          lfs: 'true'
          submodules: 'true'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ inputs.flutter_version }}
          cache: true

      - name: Configure dependency manager
        run: |
          if [ "${{ matrix.dependency_manager }}" = "cocoapods" ]; then
            flutter config --no-enable-swift-package-manager
          else
            flutter config --enable-swift-package-manager
          fi
          flutter config --list

      - name: Resolve dependencies
        run: flutter pub get
        working-directory: agora_rtc_engine/example

      - name: Build ${{ matrix.platform }} app
        working-directory: agora_rtc_engine/example
        run: |
          if [ "${{ matrix.platform }}" = "ios" ]; then
            flutter build ios --release --no-codesign
          else
            flutter config --enable-macos-desktop
            flutter build macos --release
          fi

      - name: Archive ${{ matrix.platform }} app without signing
        working-directory: agora_rtc_engine/example
        run: |
          if [ "${{ matrix.platform }}" = "ios" ]; then
            xcodebuild \
              -workspace ios/Runner.xcworkspace \
              -scheme Runner \
              -configuration Release \
              -sdk iphoneos \
              -destination generic/platform=iOS \
              -archivePath build/ios/archive/Runner.xcarchive \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              archive
          else
            xcodebuild \
              -workspace macos/Runner.xcworkspace \
              -scheme Runner \
              -configuration Release \
              -sdk macosx \
              -destination generic/platform=macOS \
              -archivePath build/macos/archive/Runner.xcarchive \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              archive
          fi

      - name: Verify ${{ matrix.platform }} ${{ matrix.dependency_manager }} linkage
        working-directory: agora_rtc_engine/example
        run: |
          set -euo pipefail

          platform="${{ matrix.platform }}"
          dependency_manager="${{ matrix.dependency_manager }}"
          project_dir="$platform"
          package_swift="$project_dir/Flutter/ephemeral/Packages/FlutterGeneratedPluginSwiftPackage/Package.swift"
          podfile_lock="$project_dir/Podfile.lock"

          if [ "$platform" = "ios" ]; then
            app="build/ios/iphoneos/Runner.app"
            archive_app="build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app"
          else
            app="build/macos/Build/Products/Release/agora_rtc_engine_example.app"
            archive_app="build/macos/archive/Runner.xcarchive/Products/Applications/agora_rtc_engine_example.app"
          fi

          symbols=(
            Iris_InitDartApiDL
            Iris_Dispose
            Iris_OnEvent
            Iris_RegisterDartPort
            Iris_UnregisterDartPort
          )

          assert_symbols() {
            local binary="$1"
            local output
            test -f "$binary" || {
              echo "::error::Missing expected binary: $binary"
              return 1
            }
            output="$(nm -gU "$binary")"
            for symbol in "${symbols[@]}"; do
              grep -qE "[[:space:]]_$symbol$" <<< "$output" || {
                echo "::error::$binary is missing _$symbol"
                return 1
              }
            done
            echo "All expected Iris symbols found in $binary"
            grep -E 'Iris_(InitDartApiDL|Dispose|OnEvent|RegisterDartPort|UnregisterDartPort)' <<< "$output"
          }

          find_symbol_owner() {
            local bundle="$1"
            local binary
            local output
            while IFS= read -r -d '' binary; do
              output="$(nm -gU "$binary" 2>/dev/null)" || continue
              if grep -qE '[[:space:]]_Iris_InitDartApiDL$' <<< "$output"; then
                echo "$binary"
                return 0
              fi
            done < <(find "$bundle" -type f -print0)
            return 1
          }

          if [ "$dependency_manager" = "swiftpm" ]; then
            test -f "$package_swift" || {
              echo "::error::Missing generated Swift package: $package_swift"
              exit 1
            }
            grep -Fq '.package(name: "agora_rtc_engine",' "$package_swift" || {
              echo "::error::agora_rtc_engine is not integrated through SwiftPM"
              exit 1
            }
            grep -Fq '.package(name: "iris_method_channel",' "$package_swift" || {
              echo "::error::iris_method_channel is not integrated through SwiftPM"
              exit 1
            }
            echo "=== Generated Swift package ==="
            sed -n '1,180p' "$package_swift"
          else
            test -f "$podfile_lock" || {
              echo "::error::Missing CocoaPods lockfile: $podfile_lock"
              exit 1
            }
            grep -Fq 'agora_rtc_engine' "$podfile_lock" || {
              echo "::error::agora_rtc_engine is not integrated through CocoaPods"
              exit 1
            }
            grep -Fq 'iris_method_channel' "$podfile_lock" || {
              echo "::error::iris_method_channel is not integrated through CocoaPods"
              exit 1
            }
            echo "=== CocoaPods lockfile ==="
            sed -n '1,240p' "$podfile_lock"
          fi

          echo "=== App bundle layout ==="
          find "$app" -maxdepth 5 -type f -print
          echo "=== Archive bundle layout ==="
          find "$archive_app" -maxdepth 5 -type f -print

          app_owner="$(find_symbol_owner "$app")" || {
            echo "::error::The $platform $dependency_manager build does not export Iris_InitDartApiDL from any App-visible binary"
            exit 1
          }
          archive_owner="$(find_symbol_owner "$archive_app")" || {
            echo "::error::The $platform $dependency_manager Archive does not export Iris_InitDartApiDL from any App-visible binary"
            exit 1
          }

          assert_symbols "$app_owner"
          assert_symbols "$archive_owner"
          echo "::notice::$platform $dependency_manager linkage verified before Archive in $app_owner"
          echo "::notice::$platform $dependency_manager linkage verified after Archive in $archive_owner"
