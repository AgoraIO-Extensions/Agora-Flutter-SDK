name: 'run: Apple dependency matrix'

on:
  workflow_call:
    inputs:
      target_branch:
        description: 'Branch to build; empty uses the caller commit'
        type: string
        required: false
        default: ''
      flutter_version:
        description: 'Flutter version for dependency linkage checks'
        type: string
        required: false
        default: '3.44.4'
      include_swiftpm_integration:
        description: 'Also build the SwiftPM integration consumer with latest stable Flutter'
        type: boolean
        required: false
        default: false
  workflow_dispatch:
    inputs:
      target_branch:
        description: 'Branch to build'
        type: string
        required: true
        default: 'release/6.5'
      flutter_version:
        description: 'Flutter version for dependency linkage checks'
        type: string
        required: true
        default: '3.44.4'
      include_swiftpm_integration:
        description: 'Also build the latest-stable SwiftPM integration consumer'
        type: boolean
        default: false

jobs:
  build:
    name: ${{ matrix.platform }} Apple package checks
    strategy:
      fail-fast: false
      matrix:
        platform: [ios, macos]
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout workflow tools
        uses: actions/checkout@v4
        with:
          path: ci-tools
          sparse-checkout: ci/run_apple_dependency_linkage.sh
          sparse-checkout-cone-mode: false
      - name: Checkout as agora_rtc_engine
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_branch || github.sha }}
          path: agora_rtc_engine
          fetch-depth: '1'
          lfs: 'true'
          submodules: 'true'
      - name: Set up latest stable Flutter
        if: ${{ inputs.include_swiftpm_integration }}
        id: swiftpm_flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build SwiftPM integration consumer
        timeout-minutes: 20
        if: ${{ !cancelled() && inputs.include_swiftpm_integration && steps.swiftpm_flutter.outcome == 'success' }}
        id: swiftpm_integration
        working-directory: agora_rtc_engine/test_shard/integration_test_swiftpm
        env:
          IOS_SIMULATOR_SDK_VERSION: 18.0
        run: |
          flutter config --enable-swift-package-manager
          flutter pub get
          if [ "${{ matrix.platform }}" = "ios" ]; then
            flutter build ios --no-codesign
          else
            flutter config --enable-macos-desktop
            flutter build macos
          fi
      - name: Remove temporary SwiftPM consumer build outputs
        if: ${{ !cancelled() && inputs.include_swiftpm_integration && steps.swiftpm_flutter.outcome == 'success' }}
        working-directory: agora_rtc_engine/test_shard/integration_test_swiftpm
        run: rm -rf build
      - name: Set up dependency-check Flutter
        if: ${{ !cancelled() && !(steps.swiftpm_flutter.outcome == 'success' && steps.swiftpm_flutter.outputs.VERSION == inputs.flutter_version) }}
        id: dependency_flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ inputs.flutter_version }}
          cache: true
      - name: Verify CocoaPods build and archive linkage
        timeout-minutes: 20
        if: ${{ !cancelled() && (steps.dependency_flutter.outcome == 'success' || (steps.swiftpm_flutter.outcome == 'success' && steps.swiftpm_flutter.outputs.VERSION == inputs.flutter_version)) }}
        id: cocoapods_linkage
        run: bash ci-tools/ci/run_apple_dependency_linkage.sh "$GITHUB_WORKSPACE/agora_rtc_engine" '${{ matrix.platform }}' cocoapods
      - name: Verify SwiftPM build and archive linkage
        timeout-minutes: 20
        if: ${{ !cancelled() && (steps.dependency_flutter.outcome == 'success' || (steps.swiftpm_flutter.outcome == 'success' && steps.swiftpm_flutter.outputs.VERSION == inputs.flutter_version)) }}
        id: swiftpm_linkage
        run: bash ci-tools/ci/run_apple_dependency_linkage.sh "$GITHUB_WORKSPACE/agora_rtc_engine" '${{ matrix.platform }}' swiftpm
