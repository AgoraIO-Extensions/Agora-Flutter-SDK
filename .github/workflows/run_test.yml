name: 'run: test'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_call:
    secrets:
      APP_ID:
        required: true

jobs:
  flutter_codestyle_check:
    name: Flutter codestyle/analyze check
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'ci:skip') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - name: Check Dart Format
        id: pub_publish_check
        continue-on-error: true
        run: bash ci/dart_pub_publish_check.sh
      - uses: axel-op/dart-package-analyzer@v3
        id: analysis
        with:
          githubToken: ${{ secrets.GITHUB_TOKEN }}
      - name: Check scores
        env:
          TOTAL: ${{ steps.analysis.outputs.total }}
          TOTAL_MAX: ${{ steps.analysis.outputs.total_max }}
        run: |
          if (( $TOTAL_MAX - $TOTAL > 20 ))
          then
            echo Pub Score too low.
            exit 1
          fi
      - name: Fail on publish dry-run check
        if: ${{ always() && steps.pub_publish_check.outcome == 'failure' }}
        run: |
          echo "Publication check failed."
          exit 1

  flutter_ut:
    name: Flutter unit test
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'ci:skip') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - run: flutter test

  attach_docs:
    name: Attach dartdoc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - name: Build DartDoc 📖
        run: |
          dart pub get
          # Generate DartDoc
          dart doc
          # Create a zip file of the DartDoc output
          zip -r agora_rtc_engine_docs.zip doc
      - name: Upload DartDoc Artifact ⬆️
        uses: actions/upload-artifact@v4
        with:
          name: agora_rtc_engine_docs.zip
          path: agora_rtc_engine_docs.zip
  pub_publish_check:
    name: pub publish check
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'ci:skip') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - run: bash ci/dart_pub_publish_check.sh

  integration_test_android:
    name: Run Flutter Android Integration Tests
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'ci:skip') }}
    strategy:
      fail-fast: false
      matrix:
        # Probe the actual support floor with real runtime tests before we
        # commit to a higher minimum Flutter version in package metadata.
        version: ["3.16", "3.24.5", "3.38.5"]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TEST_APP_ID: ${{ secrets.APP_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Install JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.version }}
          cache: true
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: run flutter android integration tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          arch: x86_64
          profile: pixel_5
          ram-size: 2048M
          heap-size: 2048M
          disk-size: 6144M
          emulator-boot-timeout: 600
          disable-animations: true
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash ci/run_flutter_integration_test_android.sh

  integration_test_android_canary:
    name: Run Flutter Android Integration Tests (latest stable canary)
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'ci:skip') }}
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TEST_APP_ID: ${{ secrets.APP_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Install JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: run flutter android integration tests on latest stable
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          arch: x86_64
          profile: pixel_5
          ram-size: 2048M
          heap-size: 2048M
          disk-size: 6144M
          emulator-boot-timeout: 600
          disable-animations: true
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash ci/run_flutter_integration_test_android.sh

  integration_test_ios:
    name: Run Flutter iOS Integration Tests
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'ci:skip') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: "3.16"
            model: "iPhone 16e"
            os_version: ">=26.2"
          - version: "3.38.5"
            model: "iPhone 16e"
            os_version: ">=26.2"
    runs-on: macos-26
    timeout-minutes: 120
    env:
      TEST_APP_ID: ${{ secrets.APP_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.version }}
          cache: true
      - name: Setup latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Verify Xcode
        run: |
          xcode-select --print-path
          xcodebuild -version
          echo "Available iOS SDKs:"
          xcodebuild -showsdks | grep iphoneos
          echo "Available iOS Simulator SDKs:"
          xcodebuild -showsdks | grep iphonesimulator
      - uses: futureware-tech/simulator-action@v4
        with:
          model: ${{ matrix.model }}
          os: iOS
          os_version: ${{ matrix.os_version }}
          erase_before_boot: true
          wait_for_boot: true
          shutdown_after_job: true
      - run: bash ci/run_flutter_integration_test_ios.sh
      - name: Get ios crash logs
        if: always()
        run: |
          sleep 30

          mkdir logs-ios

          CRASH_DIR="${HOME}/Library/Logs/DiagnosticReports/"
          OUTPUT_CRASH_DIR=./logs-ios/crash
          mkdir -p ${OUTPUT_CRASH_DIR}

          # Copy all files
          cp -RP $CRASH_DIR* $OUTPUT_CRASH_DIR || true
        
      - name: Upload ios logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-ios-${{ matrix.version }}
          path: logs-ios/*

  integration_test_macos:
    name: Run Flutter macOS Integration Tests
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'ci:skip') }}
    strategy:
      fail-fast: false
      matrix:
        version: ["3.16", "3.38.5"]
    runs-on: macos-latest
    timeout-minutes: 120
    env:
      TEST_APP_ID: ${{ secrets.APP_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.version }}
          cache: true
      - run: flutter config --enable-macos-desktop
      - run: bash ci/run_flutter_macos_integration_test.sh
      - name: Get iris logs macos
        if: always()
        run: |
          sleep 30

          mkdir iris-logs-macos
          if [ -f "${HOME}/Library/Containers/com.example.fakeTestApp/Data/Library/agora-iris.log" ]; then
            cp -RP ${HOME}/Library/Containers/com.example.fakeTestApp/Data/Library/agora-iris.log ./iris-logs-macos/agora-iris-fake-test.log || true
          fi
          if [ -f "${HOME}/Library/Containers/com.example.integrationTestApp/Data/Library/agora-iris.log" ]; then
            cp -RP ${HOME}/Library/Containers/com.example.integrationTestApp/Data/Library/agora-iris.log ./iris-logs-macos/agora-iris-integration-test.log || true
          fi

          CRASH_DIR="${HOME}/Library/Logs/DiagnosticReports/"
          OUTPUT_CRASH_DIR=./iris-logs-macos/crash
          mkdir -p ${OUTPUT_CRASH_DIR}

          # Copy all files
          cp -RP $CRASH_DIR* $OUTPUT_CRASH_DIR || true
          
      - name: Upload iris logs macos
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iris-logs-macos-${{ matrix.version }}
          path: iris-logs-macos/*

  pub_package_smoke_test_macos:
    name: Run Flutter macOS Published Package Smoke Test
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'ci:skip') }}
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.5"
          cache: true
      - run: flutter config --enable-macos-desktop
      - name: Run macOS published package smoke test
        run: bash ci/run_flutter_macos_published_package_smoke_test.sh

  pub_package_smoke_test_ios:
    name: Run Flutter iOS Published Package Smoke Test
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'ci:skip') }}
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.5"
          cache: true
      - name: Run iOS published package smoke test
        run: bash ci/run_flutter_ios_published_package_smoke_test.sh

  integration_test_swiftpm:
    name: Run Flutter SwiftPM Integration Tests
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'ci:skip') }}
    strategy:
      fail-fast: false
      matrix:
        os: ["macos", "ios"]
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - name: Run flutter integration test swiftpm for ${{ matrix.os }}
        if: ${{ matrix.os == 'macos' }}
        run: |
          flutter pub get
          flutter build ${{ matrix.os }}
        working-directory: test_shard/integration_test_swiftpm
      - name: Run flutter integration test swiftpm for ${{ matrix.os }}
        if: ${{ matrix.os == 'ios' }}
        run: |
          flutter pub get
          flutter build ${{ matrix.os }} --no-codesign
        working-directory: test_shard/integration_test_swiftpm
        env:
          IOS_SIMULATOR_SDK_VERSION: 18.0

  integration_test_windows:
    name: Run Flutter Windows Integration Tests
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'ci:skip') }}
    strategy:
      fail-fast: false
      matrix:
        version: ["3.24.5", "3.38.5"]  # Note: 3.7.0 removed due to SDK compatibility issues
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      TEST_APP_ID: ${{ secrets.APP_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.version }}
          cache: true
      - name: Set up crash dump environment
        run: .\ci\setup-crash-dumps.ps1
        shell: powershell
      - run: flutter config --enable-windows-desktop
      - name: Clean build artifacts
        shell: bash
        run: |
          cd test_shard/integration_test_app
          flutter clean
          flutter pub get
      - name: Run windows integration test
        shell: bash
        run: |
          bash ci/run_flutter_windows_integration_test.sh

      - name: Upload crash dumps if exist
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-crash-dumps-${{ matrix.version }}
          path: ./CrashDumps/*

  integration_test_web:
    name: Run Flutter Web Integration Tests
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'ci:skip') }}
    strategy:
      matrix:
        version: ["3.24.5", "3.38.5"]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TEST_APP_ID: ${{ secrets.APP_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.version }}
          cache: true
      - name: Run web integration test
        shell: bash
        run: |
          chromedriver --port=4444 --trace-buffer-size=100000 &
          bash ci/run_flutter_integration_test_web.sh

  build_android_ubuntu:
    name: Build Android on Ubuntu
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'ci:skip') }}
    strategy:
      fail-fast: false
      matrix:
        version: ["3.16", "3.24.5", "3.38.5"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.version }}
          cache: true
      - run: flutter pub get
      - name: Run flutter build apk
        run: flutter build apk
        working-directory: example

  build_android_windows:
    name: Build Android on Windows
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'ci:skip') }}
    strategy:
      fail-fast: false
      matrix:
        version: ["3.16", "3.24.5", "3.38.5"]
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Install JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.version }}
          cache: true
      - run: flutter pub get
      - name: Run flutter build apk
        run: flutter build apk
        working-directory: example

  build_ios:
    name: Build iOS
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'ci:skip') }}
    strategy:
      fail-fast: false
      matrix:
        version: ["3.16", "3.38.5"]
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.version }}
          cache: true
      - run: flutter pub get
      - name: Run flutter build ios --no-codesign --simulator
        run: flutter build ios --no-codesign --simulator
        working-directory: example
        env:
          IOS_SIMULATOR_SDK_VERSION: 18.0

  ios_dependency_linkage_matrix:
    name: iOS dependency linkage - ${{ matrix.name }} (expected ${{ matrix.expected_result }})
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'ci:skip') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: agora_rtc_engine-cocoapods-iris_method_channel-cocoapods
            disable_swift_package_manager: true
            iris_method_channel_ref: 2.2.5
            expected_result: pass
            symbol_binary: Frameworks/iris_method_channel.framework/iris_method_channel
          - name: agora_rtc_engine-cocoapods-iris_method_channel-spm-static
            disable_swift_package_manager: false
            iris_method_channel_ref: 2.2.5
            expected_result: fail
            symbol_binary: ''
          - name: agora_rtc_engine-cocoapods-iris_method_channel-spm-dynamic
            disable_swift_package_manager: false
            iris_method_channel_ref: fix/iris-method-channel-spm-symbol-retain
            expected_result: pass
            symbol_binary: Frameworks/iris-method-channel.framework/iris-method-channel
          # Enable after agora_rtc_engine/Package.swift is restored:
          # - name: agora_rtc_engine-spm-iris_method_channel-spm-dynamic
          #   disable_swift_package_manager: false
          #   iris_method_channel_ref: fix/iris-method-channel-spm-symbol-retain
          #   expected_result: pass
          #   symbol_binary: Frameworks/iris-method-channel.framework/iris-method-channel
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          cache: true
      - name: Configure Swift Package Manager
        run: |
          if [ "${{ matrix.disable_swift_package_manager }}" = "true" ]; then
            flutter config --no-enable-swift-package-manager
          else
            flutter config --enable-swift-package-manager
          fi
          flutter config --list
      - name: Select iris_method_channel revision
        env:
          IRIS_METHOD_CHANNEL_REF: ${{ matrix.iris_method_channel_ref }}
        run: |
          ruby -e 'path = "pubspec.yaml"; text = File.read(path); ref = ENV.fetch("IRIS_METHOD_CHANNEL_REF"); pattern = /(iris_method_channel:\s+git:\s+url:\s+\S+\s+ref:\s+)\S+/; abort "iris_method_channel ref not found" unless text.match?(pattern); File.write(path, text.sub(pattern, "\\1#{ref}"))'
      - name: Resolve dependencies
        run: flutter pub get
        working-directory: example
      - name: Build iOS app without signing
        run: flutter build ios --release --no-codesign
        working-directory: example
      - name: Archive iOS app without signing
        run: |
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -destination generic/platform=iOS \
            -archivePath build/ios/archive/Runner.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            archive
        working-directory: example
      - name: Verify expected Iris linkage result
        env:
          EXPECTED_RESULT: ${{ matrix.expected_result }}
          SYMBOL_BINARY: ${{ matrix.symbol_binary }}
        working-directory: example
        run: |
          set -euo pipefail
          app="build/ios/iphoneos/Runner.app"
          archive_app="build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app"

          symbols=(
            Iris_InitDartApiDL
            Iris_Dispose
            Iris_OnEvent
            Iris_RegisterDartPort
            Iris_UnregisterDartPort
          )

          assert_symbols() {
            local binary="$1"
            local output
            test -f "$binary" || {
              echo "::error::Missing expected binary: $binary"
              return 1
            }
            output="$(nm -gU "$binary")"
            for symbol in "${symbols[@]}"; do
              grep -qE "[[:space:]]_$symbol$" <<< "$output" || {
                echo "::error::$binary is missing _$symbol"
                return 1
              }
            done
            echo "All expected Iris symbols found in $binary"
            grep -E 'Iris_(InitDartApiDL|Dispose|OnEvent|RegisterDartPort|UnregisterDartPort)' <<< "$output"
          }

          find_symbol_owner() {
            local bundle="$1"
            local binary
            for binary in "$bundle/Runner" "$bundle"/Frameworks/*.framework/*; do
              [ -f "$binary" ] || continue
              if nm -gU "$binary" 2>/dev/null \
                | grep -qE 'Iris_(InitDartApiDL|Dispose|OnEvent|RegisterDartPort|UnregisterDartPort)'; then
                echo "$binary"
                return 0
              fi
            done
            return 1
          }

          echo "=== Runner.app layout ==="
          find "$app/Frameworks" -maxdepth 1 -type d -iname '*iris*' -print 2>/dev/null || true
          echo "=== Archive layout ==="
          find "$archive_app/Frameworks" -maxdepth 1 -type d -iname '*iris*' -print 2>/dev/null || true
          echo "=== Runner symbols ==="
          nm -gU "$app/Runner" 2>/dev/null | grep -E 'Iris_(InitDartApiDL|Dispose|OnEvent|RegisterDartPort|UnregisterDartPort)' || true
          echo "=== Archive symbols ==="
          nm -gU "$archive_app/Runner" 2>/dev/null | grep -E 'Iris_(InitDartApiDL|Dispose|OnEvent|RegisterDartPort|UnregisterDartPort)' || true

          if [ "$EXPECTED_RESULT" = "pass" ]; then
            assert_symbols "$app/$SYMBOL_BINARY"
            assert_symbols "$archive_app/$SYMBOL_BINARY"
            echo "::notice::Expected passing linkage verified before and after Archive"
          else
            assert_symbols "$app/Runner"
            if owner="$(find_symbol_owner "$archive_app")"; then
              echo "::error::Expected the known SPM static failure, but Archive still exports Iris symbols from $owner"
              exit 1
            fi
            echo "::notice::Expected SPM static failure reproduced: Archive removed the Iris symbols"
          fi

  build_ios_canary:
    name: Build iOS (latest stable canary)
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'ci:skip') }}
    continue-on-error: true
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - name: Run flutter build ios --no-codesign --simulator on latest stable
        run: flutter build ios --no-codesign --simulator
        working-directory: example
        env:
          IOS_SIMULATOR_SDK_VERSION: 18.0

  build_web:
    name: Build Web
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'ci:skip') }}
    strategy:
      fail-fast: false
      matrix:
        version: ["3.24.5", "3.38.5"]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.version }}
          cache: true
      - run: flutter packages get
      - name: Run flutter build web
        run: flutter build web
        working-directory: example

  rendering_test_android:
    name: Run Flutter Android Rendering Tests
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'ci:skip') }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TEST_APP_ID: ${{ secrets.APP_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Install JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.5"
          cache: true
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: run flutter android integration tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          arch: x86_64
          profile: pixel_5
          ram-size: 2048M
          heap-size: 2048M
          disk-size: 6144M
          emulator-boot-timeout: 600
          disable-animations: true
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash ci/rendering_test_android.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-debug-golden-files
          path: test_shard/rendering_test/screenshot/*.debug.png

  rendering_test_ios:
    name: Run Flutter iOS Rendering Tests
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'ci:skip') }}
    strategy:
      matrix:
        include:
          - version: "3.24.5"
            runner: macos-15
            model: "iPhone 16 Pro"
            os_version: "18.5"
            xcode_version: "16.4"
          - version: "3.38.5"
            runner: macos-26
            model: "iPhone 16e"
            os_version: ">=26.2"
            xcode_version: latest-stable
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      TEST_APP_ID: ${{ secrets.APP_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.version }}
          cache: true
      - name: Setup Xcode ${{ matrix.xcode_version }}
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ matrix.xcode_version }}
      - uses: futureware-tech/simulator-action@v4
        with:
          model: ${{ matrix.model }}
          os: iOS
          os_version: ${{ matrix.os_version }}
          erase_before_boot: true
          wait_for_boot: true
          shutdown_after_job: true
      - run: bash ci/rendering_test_ios.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-debug-golden-files-${{ matrix.version }}
          path: test_shard/rendering_test/screenshot/*.debug.png

  rendering_test_macos:
    name: Run Flutter macOS Rendering Tests
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'ci:skip') }}
    strategy:
      matrix:
        version: ["3.24.5", "3.38.5"]
    runs-on: macos-latest
    timeout-minutes: 120
    env:
      TEST_APP_ID: ${{ secrets.APP_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.version }}
          cache: true
      - run: flutter config --enable-macos-desktop
      - name: Run macos rendering test
        run: |
          export SAVE_DEBUG_GOLDEN="true"
          bash ci/rendering_test_macos.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-debug-golden-files-${{ matrix.version }}
          path: test_shard/rendering_test/screenshot/*.debug.png

  rendering_test_windows:
    name: Run Flutter Windows Rendering Tests
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'ci:skip') }}
    strategy:
      matrix:
        version: ["3.24.5", "3.38.5"]
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      TEST_APP_ID: ${{ secrets.APP_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.version }}
          cache: true
      - run: flutter config --enable-windows-desktop
      - name: Run windows integration test
        shell: bash
        run: |
          export SAVE_DEBUG_GOLDEN="true"

          bash ci/rendering_test_windows.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-debug-golden-files-${{ matrix.version }}
          path: test_shard/rendering_test/screenshot/*.debug.png

  rendering_test_web:
    name: Run Flutter Web Rendering Tests
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'ci:skip') }}
    strategy:
      matrix:
        version: ["3.24.5", "3.38.5"]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TEST_APP_ID: ${{ secrets.APP_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.version }}
          cache: true
      - name: Run web rendering test
        shell: bash
        run: |
          export SAVE_DEBUG_GOLDEN="true"

          chromedriver --port=4444 --trace-buffer-size=100000 &
          bash ci/run_rendering_test.sh web

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-debug-golden-files-${{ matrix.version }}
          path: test_shard/rendering_test/screenshot/*.debug.png

  check_android15_16k_page_alignment:
    name: Check android15 16k page size alignment
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'ci:skip') }}
    strategy:
      matrix:
        version: ["3.38.5"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.version }}
          cache: true
      - run: flutter pub get
      - name: Run flutter build apk
        run: flutter build apk
        working-directory: example
      - name: Check android15 16k page size alignment
        run: bash scripts/check_android15_16k_page_alignment.sh example/build/app/intermediates/merged_native_libs/release/mergeReleaseNativeLibs/out/lib/arm64-v8a/libiris_rendering_android.so
