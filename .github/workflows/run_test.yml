name: 'run: test'

concurrency:
  group: run-test-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  workflow_call:
    secrets:
      APP_ID:
        required: true

jobs:
  flutter_codestyle_check:
    name: Flutter codestyle/analyze check
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'ci:skip') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - name: Check Dart Format
        run: bash ci/dart_pub_publish_check.sh
      - uses: axel-op/dart-package-analyzer@v3
        id: analysis
        with:
          githubToken: ${{ secrets.GITHUB_TOKEN }}
      - name: Check scores
        env:
          TOTAL: ${{ steps.analysis.outputs.total }}
          TOTAL_MAX: ${{ steps.analysis.outputs.total_max }}
        run: |
          if (( $TOTAL_MAX - $TOTAL > 20 ))
          then
            echo Pub Score too low.
            exit 1
          fi

  flutter_ut:
    name: Flutter unit test
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'ci:skip') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - run: flutter test

  attach_docs:
    name: Attach dartdoc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - name: Build DartDoc 📖
        run: |
          dart pub get
          # Generate DartDoc
          dart doc
          # Create a zip file of the DartDoc output
          zip -r agora_rtc_engine_docs.zip doc
      - name: Upload DartDoc Artifact ⬆️
        uses: actions/upload-artifact@v4
        with:
          name: agora_rtc_engine_docs.zip
          path: agora_rtc_engine_docs.zip
  pub_publish_check:
    name: pub publish check
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'ci:skip') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - run: bash ci/dart_pub_publish_check.sh

  integration_test_android:
    name: Run Flutter Android Integration Tests
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'ci:skip') }}
    strategy:
      fail-fast: false
      matrix:
        version: ["3.16", "3.24.5", "3.38.5"]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TEST_APP_ID: ${{ secrets.APP_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Install JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.version }}
          cache: true
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: run flutter android integration tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          arch: x86_64
          profile: pixel_5
          ram-size: 2048M
          heap-size: 2048M
          disk-size: 6144M
          emulator-boot-timeout: 600
          disable-animations: true
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash ci/run_flutter_integration_test_android.sh

  integration_test_ios:
    name: Run Flutter iOS Integration Tests (3.38.5)
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'ci:skip') }}
    uses: ./.github/workflows/run_ios_integration_test.yml
    with:
      flutter_version: '3.38.5'
    secrets:
      APP_ID: ${{ secrets.APP_ID }}

  integration_test_macos:
    name: Run Flutter macOS checks (${{ matrix.version }})
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'ci:skip') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: '3.16'
            renderer_version: 3.24.5
          - version: 3.38.5
            renderer_version: 3.38.5
    runs-on: macos-26
    timeout-minutes: 120
    env:
      TEST_APP_ID: ${{ secrets.APP_ID }}
      SAVE_DEBUG_GOLDEN: 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Check Apple CI coverage
        run: ruby ci/check_apple_ci.rb
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.version }}
          cache: true
        id: runtime_flutter
      - name: Cache CocoaPods downloads
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/CocoaPods
          key: macos-rendering-pods-${{ runner.arch }}-${{ hashFiles('macos/*.podspec', 'pubspec.yaml', 'test_shard/rendering_test/pubspec.yaml', 'test_shard/rendering_test/macos/Podfile') }}
        if: ${{ !cancelled() && steps.runtime_flutter.outcome == 'success' }}
      - run: flutter config --enable-macos-desktop
        if: ${{ !cancelled() && steps.runtime_flutter.outcome == 'success' }}
      - run: bash ci/run_flutter_macos_integration_test.sh
        id: macos_api
        name: Run macOS integration tests
        if: ${{ !cancelled() && steps.runtime_flutter.outcome == 'success' }}
      - name: Run macOS published package smoke test
        run: bash ci/run_flutter_macos_published_package_smoke_test.sh
        id: published_macos
        if: ${{ !cancelled() && steps.runtime_flutter.outcome == 'success' && matrix.version == '3.38.5' }}
      - name: Run iOS published package smoke test
        run: bash ci/run_flutter_ios_published_package_smoke_test.sh
        id: published_ios
        if: ${{ !cancelled() && steps.runtime_flutter.outcome == 'success' && matrix.version == '3.38.5' }}
      - name: Resolve example dependencies
        id: example_dependencies
        if: ${{ !cancelled() && steps.runtime_flutter.outcome == 'success' }}
        run: flutter pub get
      - name: Build iOS example
        id: ios_example
        if: ${{ !cancelled() && steps.runtime_flutter.outcome == 'success' && steps.example_dependencies.outcome == 'success' }}
        run: flutter build ios --no-codesign --simulator
        working-directory: example
        env:
          IOS_SIMULATOR_SDK_VERSION: 18.0
      - name: Set up rendering Flutter
        id: renderer_flutter
        if: ${{ !cancelled() && matrix.version == '3.16' }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.renderer_version }}
          cache: true
          cache-key: 'flutter-macos-rendering-v1-:channel:-:version:-:arch:-:hash:'
      - name: Configure rendering Flutter
        if: ${{ !cancelled() && ((matrix.version == '3.38.5' && steps.runtime_flutter.outcome == 'success') || steps.renderer_flutter.outcome == 'success') }}
        run: |
          flutter config --enable-macos-desktop
          if [ "${{ matrix.version }}" = "3.16" ]; then
            flutter config --no-enable-android --no-enable-ios --no-enable-web
            rm -rf "${FLUTTER_ROOT:?}/bin/cache/artifacts/engine"/android-* \
              "${FLUTTER_ROOT:?}/bin/cache/artifacts/engine"/ios* \
              "${FLUTTER_ROOT:?}/bin/cache/flutter_web_sdk"
          fi
      - name: Resolve rendering test dependencies
        run: flutter pub get
        working-directory: test_shard/rendering_test
        if: ${{ !cancelled() && ((matrix.version == '3.38.5' && steps.runtime_flutter.outcome == 'success') || steps.renderer_flutter.outcome == 'success') }}
      - name: Get Xcode build version
        id: xcode_build
        run: echo "version=$(xcodebuild -version | tail -n 1 | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"
        if: ${{ !cancelled() && ((matrix.version == '3.38.5' && steps.runtime_flutter.outcome == 'success') || steps.renderer_flutter.outcome == 'success') }}
      - name: Cache macOS rendering build
        uses: actions/cache@v4
        with:
          path: |
            test_shard/rendering_test/.dart_tool
            test_shard/rendering_test/build/macos
            test_shard/rendering_test/macos/Pods
            test_shard/rendering_test/macos/Podfile.lock
          key: macos-rendering-build-v1-${{ runner.arch }}-${{ matrix.renderer_version }}-${{ steps.xcode_build.outputs.version }}-${{ hashFiles('test_shard/rendering_test/pubspec.lock') }}-${{ github.sha }}
          restore-keys: |
            macos-rendering-build-v1-${{ runner.arch }}-${{ matrix.renderer_version }}-${{ steps.xcode_build.outputs.version }}-${{ hashFiles('test_shard/rendering_test/pubspec.lock') }}-
        if: ${{ !cancelled() && ((matrix.version == '3.38.5' && steps.runtime_flutter.outcome == 'success') || steps.renderer_flutter.outcome == 'success') }}
      - name: Run macos rendering test
        run: |
          export SAVE_DEBUG_GOLDEN="true"
          bash ci/rendering_test_macos.sh
        if: ${{ !cancelled() && ((matrix.version == '3.38.5' && steps.runtime_flutter.outcome == 'success') || steps.renderer_flutter.outcome == 'success') }}
        id: macos_rendering
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-debug-golden-files-${{ matrix.renderer_version }}
          path: test_shard/rendering_test/screenshot/*.debug.png
      - name: Wait for crash reports after a failure
        if: ${{ failure() && !cancelled() }}
        run: sleep 30
      - name: Get iris logs macos
        if: always()
        run: |
          mkdir iris-logs-macos
          if [ -f "${HOME}/Library/Containers/com.example.fakeTestApp/Data/Library/agora-iris.log" ]; then
            cp -RP ${HOME}/Library/Containers/com.example.fakeTestApp/Data/Library/agora-iris.log ./iris-logs-macos/agora-iris-fake-test.log || true
          fi
          if [ -f "${HOME}/Library/Containers/com.example.integrationTestApp/Data/Library/agora-iris.log" ]; then
            cp -RP ${HOME}/Library/Containers/com.example.integrationTestApp/Data/Library/agora-iris.log ./iris-logs-macos/agora-iris-integration-test.log || true
          fi

          CRASH_DIR="${HOME}/Library/Logs/DiagnosticReports/"
          OUTPUT_CRASH_DIR=./iris-logs-macos/crash
          mkdir -p ${OUTPUT_CRASH_DIR}

          # Copy all files
          cp -RP $CRASH_DIR* $OUTPUT_CRASH_DIR || true
      - name: Upload iris logs macos
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iris-logs-macos-${{ matrix.version }}
          path: iris-logs-macos/*

  integration_test_windows:
    name: Run Flutter Windows Integration Tests
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'ci:skip') }}
    strategy:
      fail-fast: false
      matrix:
        version: ["3.24.5", "3.38.5"]  # Note: 3.7.0 removed due to SDK compatibility issues
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      TEST_APP_ID: ${{ secrets.APP_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.version }}
          cache: true
      - name: Set up crash dump environment
        run: .\ci\setup-crash-dumps.ps1
        shell: powershell
      - run: flutter config --enable-windows-desktop
      - name: Clean build artifacts
        shell: bash
        run: |
          cd test_shard/integration_test_app
          flutter clean
          flutter pub get
      - name: Run windows integration test
        shell: bash
        run: |
          bash ci/run_flutter_windows_integration_test.sh

      - name: Upload crash dumps if exist
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-crash-dumps-${{ matrix.version }}
          path: ./CrashDumps/*

  integration_test_web:
    name: Run Flutter Web Integration Tests
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'ci:skip') }}
    strategy:
      matrix:
        version: ["3.24.5", "3.38.5"]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TEST_APP_ID: ${{ secrets.APP_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.version }}
          cache: true
      - name: Run web integration test
        shell: bash
        run: |
          chromedriver --port=4444 --trace-buffer-size=100000 &
          bash ci/run_flutter_integration_test_web.sh

  build_android_ubuntu:
    name: Build Android on Ubuntu
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'ci:skip') }}
    strategy:
      fail-fast: false
      matrix:
        version: ["3.16", "3.24.5", "3.38.5"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.version }}
          cache: true
      - run: flutter pub get
      - name: Run flutter build apk
        run: flutter build apk
        working-directory: example

  build_android_windows:
    name: Build Android on Windows
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'ci:skip') }}
    strategy:
      fail-fast: false
      matrix:
        version: ["3.16", "3.24.5", "3.38.5"]
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Install JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.version }}
          cache: true
      - run: flutter pub get
      - name: Run flutter build apk
        run: flutter build apk
        working-directory: example

  apple_dependency_linkage_matrix:
    name: Apple SwiftPM dependency linkage
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'ci:skip') }}
    uses: ./.github/workflows/run_apple_dependency_matrix.yml
    with:
      flutter_version: 3.44.4
      include_swiftpm_integration: true

  build_web:
    name: Build Web
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'ci:skip') }}
    strategy:
      fail-fast: false
      matrix:
        version: ["3.24.5", "3.38.5"]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.version }}
          cache: true
      - run: flutter packages get
      - name: Run flutter build web
        run: flutter build web
        working-directory: example

  rendering_test_android:
    name: Run Flutter Android Rendering Tests
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'ci:skip') }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TEST_APP_ID: ${{ secrets.APP_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Install JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.5"
          cache: true
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: run flutter android integration tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          arch: x86_64
          profile: pixel_5
          ram-size: 2048M
          heap-size: 2048M
          disk-size: 6144M
          emulator-boot-timeout: 600
          disable-animations: true
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash ci/rendering_test_android.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-debug-golden-files
          path: test_shard/rendering_test/screenshot/*.debug.png

  rendering_test_ios:
    name: Run Flutter iOS Rendering Tests
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'ci:skip') }}
    strategy:
      matrix:
        include:
          - version: "3.24.5"
            runner: macos-15
            model: "iPhone 16 Pro"
            os_version: "18.5"
            xcode_version: "16.4"
          - version: "3.38.5"
            runner: macos-26
            model: "iPhone 16e"
            os_version: ">=26.2"
            xcode_version: latest-stable
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      TEST_APP_ID: ${{ secrets.APP_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Check VM Service discovery watchdog
        run: python3 -m unittest ci/test_flutter_vm_service_watchdog.py
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.version }}
          cache: true
      - name: Setup Xcode ${{ matrix.xcode_version }}
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ matrix.xcode_version }}
      - uses: futureware-tech/simulator-action@v4
        with:
          model: ${{ matrix.model }}
          os: iOS
          os_version: ${{ matrix.os_version }}
          erase_before_boot: true
          wait_for_boot: true
          shutdown_after_job: true
      - run: bash ci/rendering_test_ios.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-debug-golden-files-${{ matrix.version }}
          path: test_shard/rendering_test/screenshot/*.debug.png

  rendering_test_windows:
    name: Run Flutter Windows Rendering Tests
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'ci:skip') }}
    strategy:
      matrix:
        version: ["3.24.5", "3.38.5"]
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      TEST_APP_ID: ${{ secrets.APP_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.version }}
          cache: true
      - run: flutter config --enable-windows-desktop
      - name: Run windows integration test
        shell: bash
        run: |
          export SAVE_DEBUG_GOLDEN="true"

          bash ci/rendering_test_windows.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-debug-golden-files-${{ matrix.version }}
          path: test_shard/rendering_test/screenshot/*.debug.png

  rendering_test_web:
    name: Run Flutter Web Rendering Tests
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'ci:skip') }}
    strategy:
      matrix:
        version: ["3.24.5", "3.38.5"]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TEST_APP_ID: ${{ secrets.APP_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.version }}
          cache: true
      - name: Run web rendering test
        shell: bash
        run: |
          export SAVE_DEBUG_GOLDEN="true"

          chromedriver --port=4444 --trace-buffer-size=100000 &
          max_attempts=3
          for attempt in $(seq 1 $max_attempts); do
            echo "Running web rendering test (attempt $attempt/$max_attempts)"
            if bash ci/run_rendering_test.sh web; then
              exit 0
            fi
            for debug_file in test_shard/rendering_test/screenshot/*.debug.png; do
              [[ -e "$debug_file" ]] || continue
              if [[ "$debug_file" == *.attempt-*.debug.png ]]; then
                continue
              fi
              mv "$debug_file" "${debug_file%.debug.png}.attempt-$attempt.debug.png"
            done
            if (( attempt < max_attempts )); then
              sleep 10
            fi
          done

          echo "Web rendering test failed after $max_attempts attempts" >&2
          exit 1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-debug-golden-files-${{ matrix.version }}
          path: test_shard/rendering_test/screenshot/*.debug.png

  check_android15_16k_page_alignment:
    name: Check android15 16k page size alignment
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'ci:skip') }}
    strategy:
      matrix:
        version: ["3.38.5"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.version }}
          cache: true
      - run: flutter pub get
      - name: Run flutter build apk
        run: flutter build apk
        working-directory: example
      - name: Check android15 16k page size alignment
        run: bash scripts/check_android15_16k_page_alignment.sh example/build/app/intermediates/merged_native_libs/release/mergeReleaseNativeLibs/out/lib/arm64-v8a/libiris_rendering_android.so
