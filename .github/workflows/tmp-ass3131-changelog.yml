name: tmp-ass3131-changelog

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  changelog:
    if: github.event.pull_request.head.ref == 'special/6.6.4-sp.4642'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: special/6.6.4-sp.4642
          fetch-depth: 0
      - name: Insert CHANGELOG entry
        run: |
          set -euo pipefail
          if grep -qx '## 6.6.4-sp.4642' CHANGELOG.md; then
            echo "CHANGELOG entry already present, nothing to do"
            exit 0
          fi
          cat > /tmp/entry.b64 <<'B64EOF'
          IyMgNi42LjQtc3AuNDY0MgoKIyMjIERlcGVuZGVuY3kgdXBkYXRlcwoKKiBVcGRhdGUgdGhlIGlP
          UyBTREsgdG8gTmF0aXZlIDQuNi40LjIgKEFnb3JhIGJyYW5kKSBhbmQgSXJpcyA0LjYuNC4yLWJ1
          aWxkLjEuCiogSW50ZWdyYXRlIHRoZSBpT1MgU0RLIGZyb20gdGhlIEFnb3JhIENETjogdGhlIHBv
          ZHNwZWMgZG93bmxvYWRzIHRoZSBuYXRpdmUgU0RLIGFuZCB0aGUgSXJpcyB3cmFwcGVyIGluIGBw
          cmVwYXJlX2NvbW1hbmRgIGFuZCB2ZW5kb3JzIHRoZSB4Y2ZyYW1ld29ya3MgaW5zdGVhZCBvZiBk
          ZXBlbmRpbmcgb24gdGhlIGBBZ29yYVJ0Y0VuZ2luZV9TcGVjaWFsX2lPU2AgYW5kIGBBZ29yYUly
          aXNSVENfaU9TYCBDb2NvYVBvZHMgcG9kcy4KKiBQaW4gdGhlIGlPUyBTd2lmdFBNIGRlcGVuZGVu
          Y3kgdG8gdGhlIHB1Ymxpc2hlZCBOYXRpdmUgdGFnIGA0LjYuNC1yYy4yYCBhbmQgaXRzIGJpbmFy
          eSBJcmlzIHdyYXBwZXIuCiogR2VuZXJhdGUgdGhlIERhcnQgYmluZGluZ3MgZnJvbSB0aGUgYHJ0
          Y180LjYuNC4yYCBuYXRpdmUgaGVhZGVycyAocHVibGljIGhlYWRlcnMgYXJlIHVuY2hhbmdlZCBm
          cm9tIDQuNi40KS4K
          B64EOF
          base64 -d /tmp/entry.b64 > /tmp/entry.md
          python3 - <<'PYEOF'
          entry = open('/tmp/entry.md').read()
          src = open('CHANGELOG.md').read()
          marker = '# Changelog\n'
          if not src.startswith(marker):
              raise SystemExit('unexpected CHANGELOG header: ' + repr(src[:40]))
          rest = src[len(marker):]
          rest = rest[1:] if rest.startswith('\n') else rest
          open('CHANGELOG.md', 'w').write(marker + '\n' + entry.rstrip('\n') + '\n\n' + rest)
          PYEOF
          git config user.name "CaiYiPing"
          git config user.email "caiyiping@agora.io"
          git add CHANGELOG.md
          git commit -m "chore: add CHANGELOG entry for 6.6.4-sp.4642"
          git log --oneline -2
          git push origin HEAD:refs/heads/special/6.6.4-sp.4642
