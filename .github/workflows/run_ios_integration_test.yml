name: 'run: iOS integration test'

on:
  workflow_call:
    inputs:
      smoke_only:
        description: 'Run only the native SDK startup smoke'
        type: boolean
        default: false
      flutter_version:
        required: true
        type: string
    secrets:
      APP_ID:
        required: true

permissions:
  contents: read

jobs:
  runtime:
    name: ${{ inputs.smoke_only && 'iOS startup smoke' || 'Full iOS runtime' }} (${{ inputs.flutter_version }})
    runs-on: macos-26
    timeout-minutes: ${{ inputs.smoke_only && 20 || 60 }}
    env:
      IOS_SMOKE_ONLY: ${{ inputs.smoke_only }}
      TEST_APP_ID: ${{ secrets.APP_ID }}
      IOS_TEST_MAX_ATTEMPTS: '3'
    steps:
      - uses: actions/checkout@v4
      - name: Check iOS startup recovery
        run: python3 -m unittest ci/test_flutter_vm_service_watchdog.py ci/test_ios_integration_startup_retry.py
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ inputs.flutter_version }}
          cache: true
      - name: Setup latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Verify Xcode
        run: |
          xcode-select --print-path
          xcodebuild -version
          echo "Available iOS SDKs:"
          xcodebuild -showsdks | grep iphoneos
          echo "Available iOS Simulator SDKs:"
          xcodebuild -showsdks | grep iphonesimulator
      - uses: futureware-tech/simulator-action@v4
        with:
          model: "iPhone 16e"
          os: iOS
          os_version: ">=26.2"
          erase_before_boot: true
          wait_for_boot: true
          shutdown_after_job: true
      - name: Run iOS startup smoke or full API suite
        run: |
          if [[ "$IOS_SMOKE_ONLY" = true ]]; then
            bash ci/run_sdk_startup_smoke.sh ios
          else
            bash ci/run_flutter_integration_test_ios.sh
          fi
      - name: Get ios crash logs
        if: always()
        run: |
          sleep 30

          mkdir logs-ios

          CRASH_DIR="${HOME}/Library/Logs/DiagnosticReports/"
          OUTPUT_CRASH_DIR=./logs-ios/crash
          mkdir -p ${OUTPUT_CRASH_DIR}

          # Copy all files
          cp -RP $CRASH_DIR* $OUTPUT_CRASH_DIR || true
        
      - name: Upload ios logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-ios-${{ inputs.flutter_version }}
          path: logs-ios/*
