name: 'run: build example'

on:
  workflow_dispatch:
    inputs:
      target_platforms:
        description: 'Target platforms, e.g. android, ios, macos, windows, web, etc; separated by comma, default is all platforms'
        type: string
        required: true
        default: 'android, ios, macos, windows, web'
      target_branch:
        description: 'Target branch, leave empty will use the same as the workflow trigger branch'
        type: string
      issue_number:
        description: 'The number of the issue or pull request to comment build results on, leave empty will not comment on any PR'
        type: number
        required: false
      extra_build_options:
        description: 'Extra build options when running `flutter build`, e.g. --verbose, --device-id'
        type: string
        required: false
        default: ''
      extra_build_arguments:
        description: 'Extra build arguments when running `flutter build apk/ipa/other sub-commands`, e.g. --debug, --dart-define=APP_ID=1234567890, --dart-define-from-file=path/to/file.dart'
        type: string
        required: false
        default: ''
      flutter_channel:
        description: 'Target Flutter channel, e.g. stable(default), beta, dev, master (or main), or any other channel name'
        type: string
        required: false
        default: 'stable'
      flutter_version:
        description: 'Target Flutter version(s), separated by comma, e.g. "3.24.5, 3.44.8"'
        type: string
        required: false
        # we should use the latest stable version for building example later, however, the android build will fail with the latest stable version, so we fixed use the 3.24.5 version here for now
        # Here is the error log:
        # Caused by: org.gradle.api.GradleException: You are applying Flutter's app_plugin_loader Gradle plugin imperatively using the apply script method, which is not possible anymore. Migrate to applying Gradle plugins with the declarative plugins block: https://flutter.dev/to/flutter-gradle-plugin-apply
        default: '3.24.5'
      app_id_secrets:
        description: 'App ID secret(s) used for builds'
        type: choice
        required: false
        default: 'MY_APP_ID'
        options:
          - 'MY_APP_ID'
          - 'APP_ID'
          - 'MY_APP_ID, APP_ID'
  workflow_call:
    inputs:
      target_platforms:
        description: 'Target platforms, e.g. android, ios, macos, windows, web, etc; separated by comma, default is all platforms'
        type: string
        default: 'android, ios, macos, windows, web'
      target_branch:
        description: 'Target branch, leave empty will use the same as the workflow trigger branch'
        type: string
      issue_number:
        description: 'The number of the issue or pull request to comment build results on, leave empty will not comment on any PR'
        type: number
        required: false
      extra_build_options:
        description: 'Extra build options when running `flutter build`, e.g. --verbose, --device-id'
        type: string
        required: false
        default: ''
      extra_build_arguments:
        description: 'Extra build arguments when running `flutter build apk/ipa/other sub-commands`, e.g. --debug, --dart-define=APP_ID=1234567890, --dart-define-from-file=path/to/file.dart'
        type: string
        required: false
        default: ''
      flutter_channel:
        description: 'Target Flutter channel, e.g. stable(default), beta, dev, master (or main), or any other channel name'
        type: string
        required: false
        default: 'stable'
      flutter_version:
        description: 'Target Flutter version(s), separated by comma, e.g. "3.24.5, 3.44.8"'
        type: string
        required: false
        # we should use the latest stable version for building example later, however, the android build will fail with the latest stable version, so we fixed use the 3.24.5 version here for now
        # Here is the error log:
        # Caused by: org.gradle.api.GradleException: You are applying Flutter's app_plugin_loader Gradle plugin imperatively using the apply script method, which is not possible anymore. Migrate to applying Gradle plugins with the declarative plugins block: https://flutter.dev/to/flutter-gradle-plugin-apply
        default: '3.24.5'
      app_id_secrets:
        description: 'App ID secret(s) used for builds, separated by comma'
        type: string
        required: false
        default: 'MY_APP_ID'
    secrets:
      APP_ID:
        required: false
      MY_APP_ID:
        required: true
      BUILD_PROVISION_PROFILE_UUID:
        required: true
      BUILD_PROVISION_PROFILE_NAME:
        required: true
      BUILD_PROVISION_PROFILE_TEAMID:
        required: true
      BUILD_PROVISION_PROFILE_IDENTITY:
        required: true
      BUILD_CERTIFICATE_BASE64:
        required: true
      P12_PASSWORD:
        required: true
      BUILD_PROVISION_PROFILE_BASE64:
        required: true
      KEYCHAIN_PASSWORD:
        required: true
        

jobs:
  # remove label ci:build_example if the issue_number is not null and the workflow is run by workflow_call not workflow_dispatch
  remove-label:
    if: ${{ inputs.issue_number != null}}
    runs-on: ubuntu-latest
    steps:
      - name: Remove label
        uses: actions-ecosystem/action-remove-labels@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          number: ${{ inputs.issue_number }}
          labels: ci:build_example
          fail_on_error: false

  split-platforms:
    runs-on: ubuntu-latest
    outputs:
      platforms: ${{ steps.split-platforms.outputs.platforms }}
    steps:
      - id: split-platforms
        env:
          target_platforms: ${{ inputs.target_platforms }}
        run: |
          platforms=$(echo "$target_platforms" | sed 's/ //g' | tr ',' '\n' | sort -u | sed '/^$/d' | jq -R -s -c 'split("\n")[:-1]')
          echo "splited platforms: $platforms"
          # remove not supported platforms, only keep supported platforms: android, ios, macos, windows, web
          platforms=$(echo "$platforms" | jq -e 'map(select(. == "android" or . == "ios" or . == "macos" or . == "windows" or . == "web"))')
          # make platforms in oneline, and keep json format
          platforms=$(echo "$platforms" | jq -c .)
          echo "final jsonlized platforms: $platforms"
          echo "platforms=$platforms" >> $GITHUB_OUTPUT

  build-matrix:
    runs-on: ubuntu-latest
    needs: split-platforms
    outputs:
      include: ${{ steps.build-matrix.outputs.include }}
    steps:
      - id: build-matrix
        env:
          platforms: ${{ needs.split-platforms.outputs.platforms }}
          flutter_versions: ${{ inputs.flutter_version }}
          app_id_secrets: ${{ inputs.app_id_secrets }}
        run: |
          set -euo pipefail

          versions=$(printf '%s' "$flutter_versions" | sed 's/ //g' | tr ',' '\n' | jq -R -s -c 'split("\n") | map(select(length > 0))')
          if [ "$(echo "$versions" | jq 'length')" -eq 0 ]; then
            echo "::error::At least one Flutter version is required"
            exit 1
          fi

          app_ids=$(printf '%s' "$app_id_secrets" | sed 's/ //g' | tr ',' '\n' | jq -R -s -c 'split("\n") | map(select(length > 0))')
          if [ "$(echo "$app_ids" | jq 'length')" -eq 0 ]; then
            echo "::error::At least one App ID secret is required"
            exit 1
          fi
          if [ "$(echo "$app_ids" | jq '[.[] | select(. != "MY_APP_ID" and . != "APP_ID")] | length')" -ne 0 ]; then
            echo "::error::App ID secrets must be MY_APP_ID or APP_ID"
            exit 1
          fi
          if [ "$(echo "$app_ids" | jq 'length')" -ne "$(echo "$app_ids" | jq 'unique | length')" ]; then
            echo "::error::App ID secrets must not contain duplicates"
            exit 1
          fi

          include=$(jq -c -n \
            --argjson platforms "$platforms" \
            --argjson versions "$versions" \
            --argjson app_ids "$app_ids" \
            '
              {
                android: "ubuntu-latest",
                web:     "ubuntu-latest",
                windows: "windows-2022",
                ios:     "macos-latest",
                macos:   "macos-latest"
              } as $runners
              | [ $platforms[] as $p
                  | $versions[] as $v
                  | $app_ids[] as $a
                  | { platform: $p,
                      version: $v,
                      app_id_secret: $a,
                      os: $runners[$p] }
                  | select(.os != null) ]
            ')

          echo "final include: $include"
          echo "include=$include" >> $GITHUB_OUTPUT

  build:
    name: build (${{ matrix.platform }}, Flutter ${{ matrix.version }}, ${{ matrix.app_id_secret }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: build-matrix
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.build-matrix.outputs.include) }}
    env:
        platform: ${{ matrix.platform }}
        extra_build_options: ${{ inputs.extra_build_options }}
        extra_build_arguments: ${{ inputs.extra_build_arguments }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: agora_rtc_engine
          ref: ${{ inputs.target_branch || github.ref_name }}
          fetch-depth: '1'
          lfs: 'true'
          submodules: 'true'

      - name: Setup JDK for Android
        if: ${{ matrix.platform == 'android' }}
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install compatible Bundler for iOS
        if: ${{ matrix.platform == 'ios' }}
        working-directory: agora_rtc_engine/example/ios
        run: |
          # Install Bundler 2.7.x which is compatible with fastlane
          gem install bundler:2.7.2
          
          # Verify bundler version
          bundle _2.7.2_ --version
          
          # Install gems using specific bundler version
          bundle _2.7.2_ install

      - name: Setup signing key for iOS
        if: ${{ matrix.platform == 'ios' }}
        working-directory: agora_rtc_engine/example/ios
        env:
          DEFAULT_BUILD_PROVISION_PROFILE_NAME: ${{ secrets.BUILD_PROVISION_PROFILE_NAME }}
          DEFAULT_BUILD_PROVISION_PROFILE_TEAMID: ${{ secrets.BUILD_PROVISION_PROFILE_TEAMID }}
          DEFAULT_BUILD_PROVISION_PROFILE_IDENTITY: ${{ secrets.BUILD_PROVISION_PROFILE_IDENTITY }}
          DEFAULT_BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          DEFAULT_BUILD_P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          DEFAULT_BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          DEFAULT_BUILD_KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          # create variables
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/${{ secrets.BUILD_PROVISION_PROFILE_UUID }}.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          # import certificate and provisioning profile from secrets
          echo -n "$DEFAULT_BUILD_CERTIFICATE_BASE64" | base64 --decode --output $CERTIFICATE_PATH
          echo -n "$DEFAULT_BUILD_PROVISION_PROFILE_BASE64" | base64 --decode --output $PP_PATH

          # create temporary keychain
          security create-keychain -p "$DEFAULT_BUILD_KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$DEFAULT_BUILD_KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # import certificate to keychain
          security import $CERTIFICATE_PATH -P "$DEFAULT_BUILD_P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

          # apply provisioning profile
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles

          # update project settings for Runner target
          bundle _2.7.2_ exec fastlane run update_code_signing_settings use_automatic_signing:false path:Runner.xcodeproj bundle_identifier:io.agora.agoraRtcEngineExample team_id:$DEFAULT_BUILD_PROVISION_PROFILE_TEAMID profile_name:$DEFAULT_BUILD_PROVISION_PROFILE_NAME code_sign_identity:$DEFAULT_BUILD_PROVISION_PROFILE_IDENTITY targets:Runner

          # update project settings for ScreenSharing target
          bundle _2.7.2_ exec fastlane run update_code_signing_settings use_automatic_signing:false path:Runner.xcodeproj bundle_identifier:io.agora.agoraRtcEngineExample.ScreenSharing team_id:$DEFAULT_BUILD_PROVISION_PROFILE_TEAMID profile_name:$DEFAULT_BUILD_PROVISION_PROFILE_NAME code_sign_identity:$DEFAULT_BUILD_PROVISION_PROFILE_IDENTITY targets:ScreenSharing

          # replace all DEFAULT_BUILD_PROVISION_PROFILE_NAME in export.plist with $DEFAULT_BUILD_PROVISION_PROFILE_NAME
          sed -i '' "s/DEFAULT_BUILD_PROVISION_PROFILE_NAME/$DEFAULT_BUILD_PROVISION_PROFILE_NAME/g" export.plist

      - name: Update pod repo
        if: ${{ matrix.platform == 'ios' || matrix.platform == 'macos' }}
        run: pod repo update

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ inputs.flutter_channel }}
          flutter-version: ${{ matrix.version }}
          cache: true

      - name: Build
        env:
          BUILD_APP_ID: ${{ secrets.APP_ID }}
          BUILD_MY_APP_ID: ${{ secrets.MY_APP_ID }}
        shell: bash
        working-directory: agora_rtc_engine/example
        run: |
          if [ "${{ matrix.app_id_secret }}" == "MY_APP_ID" ]; then
            DEFAULT_BUILD_APP_ID="$BUILD_MY_APP_ID"
          else
            DEFAULT_BUILD_APP_ID="$BUILD_APP_ID"
          fi
          if [ -z "$DEFAULT_BUILD_APP_ID" ]; then
            echo "::error::Selected secret ${{ matrix.app_id_secret }} is empty"
            exit 1
          fi

          # show flutter version
          flutter --version && which flutter

          # install dependencies
          flutter pub get

          if [ "$platform" == "ios" ]; then
            mkdir -p ../output
            {
              echo "=== Flutter diagnostics ==="
              flutter --version
              flutter config --list
              echo "=== plugin integration state ==="
              grep -o '"swift_package_manager_enabled"[^}]*}' .flutter-plugins-dependencies || true
              echo "=== Iris dependency lock ==="
              grep -A8 -B1 '^  iris_method_channel:' pubspec.lock || true
              echo "=== generated Swift package ==="
              sed -n '1,180p' ios/Flutter/ephemeral/Packages/FlutterGeneratedPluginSwiftPackage/Package.swift 2>/dev/null || true
              echo "=== source revision ==="
              git -C .. rev-parse HEAD
              git -C .. status --short
            } | tee ../output/ios-build-diagnostics.txt
          fi

          # prepare build command, android: apk, ios: ipa, macos: macos, windows: (empty), web: web
          build_command=""
                    
          if [ "$platform" == "web" ]; then
             filtered_extra_build_arguments="${extra_build_arguments//--debug/}"
             filtered_extra_build_arguments="${filtered_extra_build_arguments//--profile/}"
             filtered_extra_build_arguments="${filtered_extra_build_arguments//--release/}"
             filtered_extra_build_arguments=$(echo "$filtered_extra_build_arguments" | sed 's/  */ /g' | sed 's/^ *//;s/ *$//')
          elif [ "$platform" == "ios" ]; then
             if [[ "$extra_build_arguments" == *"--debug"* ]]; then
               filtered_extra_build_arguments="${extra_build_arguments//--debug/--Profile}"
             else
               filtered_extra_build_arguments="$extra_build_arguments"
             fi
          else
             filtered_extra_build_arguments="$extra_build_arguments"
          fi

          if [ "$platform" == "android" ]; then
            build_command="flutter build apk"
          elif [ "$platform" == "ios" ]; then
            build_command="flutter build ipa"
          elif [ "$platform" == "macos" ]; then
            build_command="flutter build macos"
          elif [ "$platform" == "windows" ]; then
            build_command="flutter build windows"
          elif [ "$platform" == "web" ]; then
            build_command="flutter build web"
          fi

          # prepare build options
          build_options=""

          # append extra build options
          if [ -n "$extra_build_options" ]; then
            build_options="$build_options $extra_build_options"
          fi

          # prepare default build arguments, if current platform is web, set DEFAULT_BUILD_APP_ID to empty string
          if [ "$platform" == "web" ]; then
            DEFAULT_BUILD_APP_ID=""
          fi

          build_arguments="--dart-define=TEST_APP_ID=$DEFAULT_BUILD_APP_ID --dart-define=TEST_TOKEN="" --dart-define=TEST_CHANNEL_ID="testapi" --dart-define=INTERNAL_TESTING=true"

          # append extra build arguments
          if [ -n "$filtered_extra_build_arguments" ]; then
            build_arguments="$build_arguments $filtered_extra_build_arguments"
          fi

          # append build arguments for ios
          if [ "$platform" == "ios" ]; then
            build_arguments="--export-options-plist ios/export.plist $build_arguments"
          fi

          echo "========================================="
          echo "🔨 Building for platform: $platform"
          echo "🚀 Command: $build_command $build_options $build_arguments"
          echo "========================================="

          if [ "$platform" == "ios" ]; then
            flutter build ios --release --no-codesign \
              --dart-define=TEST_APP_ID="$DEFAULT_BUILD_APP_ID" \
              --dart-define=TEST_TOKEN= \
              --dart-define=TEST_CHANNEL_ID=testapi \
              --dart-define=INTERNAL_TESTING=true
            {
              echo "=== Standard Release build Iris symbols ==="
              standard_app="build/ios/iphoneos/Runner.app"
              find "$standard_app/Frameworks" -maxdepth 1 -type d -iname '*iris*' -print 2>/dev/null || true
              file "$standard_app/Runner"
              dwarfdump --uuid "$standard_app/Runner"
              nm -gU "$standard_app/Runner" 2>/dev/null \
                | grep -E 'Iris_(InitDartApiDL|Dispose|OnEvent|RegisterDartPort|UnregisterDartPort)' || true
            } | tee -a ../output/ios-build-diagnostics.txt
            cp "build/ios/iphoneos/Runner.app/Runner" ../output/standard-build-Runner
          fi

          # run build command
          if [ "$platform" == "ios" ]; then
            $build_command $build_options $build_arguments -v 2>&1 \
              | tee ../output/ios-archive-build.log
          else
            $build_command $build_options $build_arguments
          fi

          if [ "$platform" == "ios" ]; then
            {
              echo "=== Archive link, dSYM, and strip commands ==="
              grep -E '(^|[[:space:]])(Ld|Strip|GenerateDSYMFile)([[:space:]]|$)|/strip([[:space:]]|$)|xcodebuild.*(-archivePath|archive|-exportArchive)' \
                ../output/ios-archive-build.log || true
              echo "=== Release build settings ==="
              xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner -configuration Release -sdk iphoneos -showBuildSettings 2>&1 \
                | grep -E 'COPY_PHASE_STRIP|DEAD_CODE_STRIPPING|STRIP_STYLE|STRIP_INSTALLED_PRODUCT|STRIP_SWIFT_SYMBOLS|LD_GENERATE_MAP_FILE|LD_MAP_FILE_PATH|OTHER_LDFLAGS' || true
              echo "=== All Runner Mach-O files after Archive ==="
              while IFS= read -r -d '' binary; do
                if file "$binary" | grep -q 'Mach-O'; then
                  echo "[$binary]"
                  ls -l "$binary"
                  dwarfdump --uuid "$binary" || true
                  nm -gU "$binary" 2>/dev/null \
                    | grep -E 'Iris_(InitDartApiDL|Dispose|OnEvent|RegisterDartPort|UnregisterDartPort)' || true
                fi
              done < <(find build/ios "$HOME/Library/Developer/Xcode/DerivedData" -type f -name Runner -print0 2>/dev/null)
              echo "=== Archive Iris symbols ==="
              archive_app="build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app"
              find "$archive_app/Frameworks" -maxdepth 1 -type d -iname '*iris*' -print 2>/dev/null || true
              nm -gU "$archive_app/Runner" 2>/dev/null \
                | grep -E 'Iris_(InitDartApiDL|Dispose|OnEvent|RegisterDartPort|UnregisterDartPort)' || true
              echo "=== IPA layout and Iris symbols ==="
              ipa="$(find build/ios/ipa -maxdepth 1 -name '*.ipa' -print -quit)"
              inspect_dir="$(mktemp -d)"
              unzip -q "$ipa" -d "$inspect_dir"
              app="$inspect_dir/Payload/Runner.app"
              find "$app/Frameworks" -maxdepth 1 -type d -iname '*iris*' -print 2>/dev/null || true
              while IFS= read -r -d '' binary; do
                hits=$(nm -gU "$binary" 2>/dev/null | grep -E 'Iris_(InitDartApiDL|Dispose|OnEvent|RegisterDartPort|UnregisterDartPort)' || true)
                if [ -n "$hits" ]; then
                  echo "[$binary]"
                  echo "$hits"
                fi
              done < <(find "$app" -type f -perm -111 -print0)
              rm -rf "$inspect_dir"
            } | tee -a ../output/ios-build-diagnostics.txt
          fi

          # create output directory if it doesn't exist
          if [ ! -d "../output" ]; then
            mkdir -p ../output
          fi

          # copy build result to output directory by different platforms
          if [ "$platform" == "android" ]; then
            # copy files in build/app/outputs/flutter-apk directory to ../output directory
            cp build/app/outputs/flutter-apk/* ../output

            # copy whole symbol directory to ../output directory if it exists
            if [ -d "build/app/outputs/native-debug-symbols" ]; then
              cp -r build/app/outputs/native-debug-symbols ../output
            fi
          elif [ "$platform" == "ios" ]; then
            # copy build/ios/ipa/agora_rtc_engine_example.ipa to ../output directory
            cp build/ios/ipa/agora_rtc_engine_example.ipa ../output

            if [ -d "build/ios/archive/Runner.xcarchive/dSYMs" ]; then
              cp -RP build/ios/archive/Runner.xcarchive/dSYMs ../output
            fi
          elif [ "$platform" == "macos" ]; then
            # cp example/build/macos/Build/Products/*/agora_rtc_engine_example.app to ../output directory
            cp -RP build/macos/Build/Products/*/agora_rtc_engine_example.app ../output

            # mkdir dSYMs directory in ../output directory if it doesn't exist
            if [ ! -d "../output/dSYMs" ]; then
              mkdir -p ../output/dSYMs
            fi

            # copy all dSYM files from example/build/macos/Build/Products and subdirectories to ../output/dSYMs directory
            cp -RP build/macos/Build/Products/**/*.dSYM ../output/dSYMs
          elif [ "$platform" == "windows" ]; then
            # since flutter have no plain to support to build to run on 32-bit windows, we only need concern about the 64-bit windows
            
            # copy whole build/windows/x64/runner/Release directory to ../output if the directory exists
            if [ -d "build/windows/x64/runner/Release" ]; then
              cp -r build/windows/x64/runner/Release ../output

              # copy all pdb files in build/windows/x64/plugins/**/Release/ to ../output/Release
              cp -r build/windows/x64/plugins/**/Release/*.pdb ../output/Release
            fi

            # copy whole build/windows/x64/runner/Debug directory to ../output if the directory exists
            if [ -d "build/windows/x64/runner/Debug" ]; then
              cp -r build/windows/x64/runner/Debug ../output

              # copy all pdb files in build/windows/x64/plugins/**/Debug/ to ../output/Debug
              cp -r build/windows/x64/plugins/**/Debug/*.pdb ../output/Debug
            fi

            if [ -d "build/windows/x64/runner/Profile" ]; then
              cp -r build/windows/x64/runner/Profile ../output

              # copy all pdb files in build/windows/x64/plugins/**/Profile/ to ../output/Profile
              cp -r build/windows/x64/plugins/**/Profile/*.pdb ../output/Profile
            fi
          elif [ "$platform" == "web" ]; then
            # copy all files and files in subdirectories to ../output directory
            cp -r build/web/* ../output
          fi

      - name: Generate artifact name
        id: generate_artifact_name
        shell: bash
        working-directory: agora_rtc_engine
        run: |
          # get pub_version from pubspec.yaml
          pub_version=$(grep 'version: ' pubspec.yaml | sed -e 's,.*: \(.*\),\1,')
          
          # get build_timestamp
          build_timestamp=$(date +%Y%m%d%H%M%S)

          flutter_version_slug="$(printf '%s' "${{ matrix.version }}" | tr -c '[:alnum:].' '-')"
          artifact_name="agora_rtc_engine_example_${{ matrix.platform }}_flutter${flutter_version_slug}_${{ matrix.app_id_secret }}_${pub_version}_${build_timestamp}_${{ github.run_id }}"
          echo "artifact_name=$artifact_name" >> $GITHUB_OUTPUT

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.generate_artifact_name.outputs.artifact_name }}
          path: agora_rtc_engine/output
          if-no-files-found: error

  comment:
    runs-on: ubuntu-latest
    if: ${{ inputs.issue_number != null && !cancelled() }}
    needs: [build]
    steps:
      - name: Generate artifact links
        id: artifact-links
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          artifact_names=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" --paginate --jq '.artifacts[] | select(.expired == false) | .name')
          {
            echo 'links<<EOF'
            if [ -n "$artifact_names" ]; then
              while IFS= read -r artifact_name; do
                echo "- [$artifact_name](https://nightly.link/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/${artifact_name}.zip)"
              done <<< "$artifact_names"
            else
              echo '- No build artifacts were uploaded'
            fi
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - uses: peter-evans/create-or-update-comment@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ inputs.issue_number }}
          body: |
