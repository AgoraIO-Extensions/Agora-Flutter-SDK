name: 'run: build example'

on:
  workflow_dispatch:
    inputs:
      target_platforms:
        description: 'Target platforms, e.g. android, ios, macos, windows, web, etc; separated by comma, default is all platforms'
        type: string
        required: true
        default: 'android, ios, macos, windows, web, ohos'
      target_branch:
        description: 'Target branch, leave empty will use the same as the workflow trigger branch'
        type: string
      issue_number:
        description: 'The number of the issue or pull request to comment build results on, leave empty will not comment on any PR'
        type: number
        required: false
      extra_build_options:
        description: 'Extra build options when running `flutter build`, e.g. --verbose, --device-id'
        type: string
        required: false
        default: ''
      extra_build_arguments:
        description: 'Extra build arguments when running `flutter build apk/ipa/other sub-commands`, e.g. --debug, --dart-define=APP_ID=1234567890, --dart-define-from-file=path/to/file.dart'
        type: string
        required: false
        default: ''
      flutter_channel:
        description: 'Target Flutter channel, e.g. stable(default), beta, dev, master (or main), or any other channel name'
        type: string
        required: false
        default: 'stable'
      flutter_version:
        description: 'Target Flutter version, e.g. 3.24.5, 3.24.x, commit hash, or leave empty to use the latest release version of specified channel by flutter_version(default)'
        type: string
        required: false
        # we should use the latest stable version for building example later, however, the android build will fail with the latest stable version, so we fixed use the 3.24.5 version here for now
        # Here is the error log:
        # Caused by: org.gradle.api.GradleException: You are applying Flutter's app_plugin_loader Gradle plugin imperatively using the apply script method, which is not possible anymore. Migrate to applying Gradle plugins with the declarative plugins block: https://flutter.dev/to/flutter-gradle-plugin-apply
        default: '3.24.5'
  workflow_call:
    inputs:
      target_platforms:
        description: 'Target platforms, e.g. android, ios, macos, windows, web, etc; separated by comma, default is all platforms'
        type: string
        default: 'android, ios, macos, windows, web, ohos'
      target_branch:
        description: 'Target branch, leave empty will use the same as the workflow trigger branch'
        type: string
      issue_number:
        description: 'The number of the issue or pull request to comment build results on, leave empty will not comment on any PR'
        type: number
        required: false
      extra_build_options:
        description: 'Extra build options when running `flutter build`, e.g. --verbose, --device-id'
        type: string
        required: false
        default: ''
      extra_build_arguments:
        description: 'Extra build arguments when running `flutter build apk/ipa/other sub-commands`, e.g. --debug, --dart-define=APP_ID=1234567890, --dart-define-from-file=path/to/file.dart'
        type: string
        required: false
        default: ''
      flutter_channel:
        description: 'Target Flutter channel, e.g. stable(default), beta, dev, master (or main), or any other channel name'
        type: string
        required: false
        default: 'stable'
      flutter_version:
        description: 'Target Flutter version, e.g. 3.24.5, 3.24.x, commit hash, or leave empty to use the latest release version of specified channel by flutter_version(default)'
        type: string
        required: false
        # we should use the latest stable version for building example later, however, the android build will fail with the latest stable version, so we fixed use the 3.24.5 version here for now
        # Here is the error log:
        # Caused by: org.gradle.api.GradleException: You are applying Flutter's app_plugin_loader Gradle plugin imperatively using the apply script method, which is not possible anymore. Migrate to applying Gradle plugins with the declarative plugins block: https://flutter.dev/to/flutter-gradle-plugin-apply
        default: '3.24.5'
    secrets:
      APP_ID:
        required: true
      BUILD_PROVISION_PROFILE_UUID:
        required: true
      BUILD_PROVISION_PROFILE_NAME:
        required: true
      BUILD_PROVISION_PROFILE_TEAMID:
        required: true
      BUILD_PROVISION_PROFILE_IDENTITY:
        required: true
      BUILD_CERTIFICATE_BASE64:
        required: true
      P12_PASSWORD:
        required: true
      BUILD_PROVISION_PROFILE_BASE64:
        required: true
      KEYCHAIN_PASSWORD:
        required: true
      OHOS_SIGNING_MATERIAL_FILE:
        required: true
      OHOS_SIGNING_P12:
        required: true
      OHOS_SIGNING_P12_PWD:
        required: true
      OHOS_SIGNING_KEY_ALIAS:
        required: true
      OHOS_SIGNING_KEY_PWD:
        required: true
      OHOS_SIGNING_SIGN_ALG:
        required: true
      OHOS_SIGNING_PROFILE:
        required: true
      OHOS_SIGNING_CER:
        required: true

jobs:
  # remove label ci:build_example if the issue_number is not null and the workflow is run by workflow_call not workflow_dispatch
  remove-label:
    if: ${{ inputs.issue_number != null}}
    runs-on: ubuntu-latest
    steps:
      - name: Remove label
        uses: actions-ecosystem/action-remove-labels@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          number: ${{ inputs.issue_number }}
          labels: ci:build_example
          fail_on_error: false

  split-platforms:
    runs-on: ubuntu-latest
    outputs:
      platforms: ${{ steps.split-platforms.outputs.platforms }}
    steps:
      - id: split-platforms
        env:
          target_platforms: ${{ inputs.target_platforms }}
        run: |
          platforms=$(echo "$target_platforms" | sed 's/ //g' | tr ',' '\n' | sort -u | sed '/^$/d' | jq -R -s -c 'split("\n")[:-1]')
          echo "splited platforms: $platforms"
          # remove not supported platforms, only keep supported platforms: android, ios, macos, windows, web, ohos
          platforms=$(echo "$platforms" | jq -e 'map(select(. == "android" or . == "ios" or . == "macos" or . == "windows" or . == "web" or . == "ohos"))')
          # make platforms in oneline, and keep json format
          platforms=$(echo "$platforms" | jq -c .)
          echo "final jsonlized platforms: $platforms"
          echo "platforms=$platforms" >> $GITHUB_OUTPUT

  build:
    runs-on: ${{ matrix.os }}
    needs: split-platforms
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        platform: ${{ fromJson(needs.split-platforms.outputs.platforms) }}
        exclude:
          - os: ubuntu-latest
            platform: android
          - os: ubuntu-latest
            platform: ios
          - os: ubuntu-latest
            platform: macos
          - os: ubuntu-latest
            platform: windows
          - os: ubuntu-latest
            platform: ohos
          - os: macos-latest
            platform: windows
          - os: macos-latest
            platform: web
          - os: windows-latest
            platform: android
          - os: windows-latest
            platform: ios
          - os: windows-latest
            platform: macos
          - os: windows-latest
            platform: web
          - os: windows-latest
            platform: ohos
    env:
        platform: ${{ matrix.platform }}
        extra_build_options: ${{ inputs.extra_build_options }}
        extra_build_arguments: ${{ inputs.extra_build_arguments }}
    outputs:
      artifact_nightly_link_android: ${{ steps.setup_output.outputs.artifact_nightly_link_android }}
      artifact_nightly_link_ios: ${{ steps.setup_output.outputs.artifact_nightly_link_ios }}
      artifact_nightly_link_macos: ${{ steps.setup_output.outputs.artifact_nightly_link_macos }}
      artifact_nightly_link_windows: ${{ steps.setup_output.outputs.artifact_nightly_link_windows }}
      artifact_nightly_link_web: ${{ steps.setup_output.outputs.artifact_nightly_link_web }}
      artifact_nightly_link_ohos: ${{ steps.setup_output.outputs.artifact_nightly_link_ohos }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_branch || github.ref_name }}
          fetch-depth: '1'
          lfs: 'true'
          submodules: 'true'

      - name: Setup JDK for Android and OHOS
        if: ${{ matrix.platform == 'android' || matrix.platform == 'ohos' }}
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install compatible Bundler for iOS
        if: ${{ matrix.platform == 'ios' }}
        working-directory: example/ios
        run: |
          # Install Bundler 2.7.x which is compatible with fastlane
          gem install bundler:2.7.2
          
          # Verify bundler version
          bundle _2.7.2_ --version
          
          # Install gems using specific bundler version
          bundle _2.7.2_ install

      - name: Setup signing key for iOS
        if: ${{ matrix.platform == 'ios' }}
        working-directory: example/ios
        env:
          DEFAULT_BUILD_PROVISION_PROFILE_NAME: ${{ secrets.BUILD_PROVISION_PROFILE_NAME }}
          DEFAULT_BUILD_PROVISION_PROFILE_TEAMID: ${{ secrets.BUILD_PROVISION_PROFILE_TEAMID }}
          DEFAULT_BUILD_PROVISION_PROFILE_IDENTITY: ${{ secrets.BUILD_PROVISION_PROFILE_IDENTITY }}
          DEFAULT_BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          DEFAULT_BUILD_P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          DEFAULT_BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          DEFAULT_BUILD_KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          # create variables
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/${{ secrets.BUILD_PROVISION_PROFILE_UUID }}.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          # import certificate and provisioning profile from secrets
          echo -n "$DEFAULT_BUILD_CERTIFICATE_BASE64" | base64 --decode --output $CERTIFICATE_PATH
          echo -n "$DEFAULT_BUILD_PROVISION_PROFILE_BASE64" | base64 --decode --output $PP_PATH

          # create temporary keychain
          security create-keychain -p "$DEFAULT_BUILD_KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$DEFAULT_BUILD_KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # import certificate to keychain
          security import $CERTIFICATE_PATH -P "$DEFAULT_BUILD_P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

          # apply provisioning profile
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles

          # update project settings for Runner target
          bundle _2.7.2_ exec fastlane run update_code_signing_settings use_automatic_signing:false path:Runner.xcodeproj bundle_identifier:io.agora.agoraRtcEngineExample team_id:$DEFAULT_BUILD_PROVISION_PROFILE_TEAMID profile_name:$DEFAULT_BUILD_PROVISION_PROFILE_NAME code_sign_identity:$DEFAULT_BUILD_PROVISION_PROFILE_IDENTITY targets:Runner

          # update project settings for ScreenSharing target
          bundle _2.7.2_ exec fastlane run update_code_signing_settings use_automatic_signing:false path:Runner.xcodeproj bundle_identifier:io.agora.agoraRtcEngineExample.ScreenSharing team_id:$DEFAULT_BUILD_PROVISION_PROFILE_TEAMID profile_name:$DEFAULT_BUILD_PROVISION_PROFILE_NAME code_sign_identity:$DEFAULT_BUILD_PROVISION_PROFILE_IDENTITY targets:ScreenSharing

          # replace all DEFAULT_BUILD_PROVISION_PROFILE_NAME in export.plist with $DEFAULT_BUILD_PROVISION_PROFILE_NAME
          sed -i '' "s/DEFAULT_BUILD_PROVISION_PROFILE_NAME/$DEFAULT_BUILD_PROVISION_PROFILE_NAME/g" export.plist

      - name: Update pod repo
        if: ${{ matrix.platform == 'ios' || matrix.platform == 'macos' }}
        run: pod repo update

      - name: Setup Flutter
        if: ${{ matrix.platform != 'ohos' }}
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ inputs.flutter_channel }}
          flutter-version: ${{ inputs.flutter_version }}
          cache: true

      - name: Check OHOS signing secrets
        if: ${{ matrix.platform == 'ohos' }}
        shell: bash
        env:
          OHOS_SIGNING_MATERIAL_FILE: ${{ secrets.OHOS_SIGNING_MATERIAL_FILE }}
          OHOS_SIGNING_P12: ${{ secrets.OHOS_SIGNING_P12 }}
          OHOS_SIGNING_P12_PWD: ${{ secrets.OHOS_SIGNING_P12_PWD }}
          OHOS_SIGNING_KEY_ALIAS: ${{ secrets.OHOS_SIGNING_KEY_ALIAS }}
          OHOS_SIGNING_KEY_PWD: ${{ secrets.OHOS_SIGNING_KEY_PWD }}
          OHOS_SIGNING_SIGN_ALG: ${{ secrets.OHOS_SIGNING_SIGN_ALG }}
          OHOS_SIGNING_PROFILE: ${{ secrets.OHOS_SIGNING_PROFILE }}
          OHOS_SIGNING_CER: ${{ secrets.OHOS_SIGNING_CER }}
        run: |
          missing=0
          for name in \
            OHOS_SIGNING_MATERIAL_FILE \
            OHOS_SIGNING_P12 \
            OHOS_SIGNING_P12_PWD \
            OHOS_SIGNING_KEY_ALIAS \
            OHOS_SIGNING_KEY_PWD \
            OHOS_SIGNING_SIGN_ALG \
            OHOS_SIGNING_PROFILE \
            OHOS_SIGNING_CER; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository secret ${name} is not configured"
              missing=1
            fi
          done
          exit "${missing}"

      - name: Cache OHOS Flutter
        if: ${{ matrix.platform == 'ohos' }}
        id: cache-ohos-flutter
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/flutter/3.35.8-ohos-1.0.1
          key: flutter-ohos-git-${{ runner.os }}-${{ runner.arch }}-3.35.8-ohos-1.0.1-a82fc2f1e07432b99713a508d2f9fc1a6c3873b1-v1

      - name: Download OHOS Flutter
        if: ${{ matrix.platform == 'ohos' && steps.cache-ohos-flutter.outputs.cache-hit != 'true' }}
        shell: bash
        env:
          OHOS_FLUTTER_HOME: ${{ runner.temp }}/flutter/3.35.8-ohos-1.0.1
          OHOS_FLUTTER_GIT_URL: 'https://gitcode.com/CPF-Flutter/flutter_flutter.git'
          OHOS_FLUTTER_GIT_TAG: '3.35.8-ohos-1.0.1'
          OHOS_FLUTTER_GIT_COMMIT: 'a82fc2f1e07432b99713a508d2f9fc1a6c3873b1'
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "${OHOS_FLUTTER_HOME}")"
          git init "${OHOS_FLUTTER_HOME}"
          git -C "${OHOS_FLUTTER_HOME}" remote add origin "${OHOS_FLUTTER_GIT_URL}"
          git -C "${OHOS_FLUTTER_HOME}" fetch --depth 1 origin \
            "refs/tags/${OHOS_FLUTTER_GIT_TAG}:refs/tags/${OHOS_FLUTTER_GIT_TAG}"

          actual_commit=$(git -C "${OHOS_FLUTTER_HOME}" rev-list -n 1 "refs/tags/${OHOS_FLUTTER_GIT_TAG}")
          if [ "${actual_commit}" != "${OHOS_FLUTTER_GIT_COMMIT}" ]; then
            echo "::error::Unexpected OHOS Flutter commit: ${actual_commit}"
            exit 1
          fi

          git -C "${OHOS_FLUTTER_HOME}" checkout --detach "refs/tags/${OHOS_FLUTTER_GIT_TAG}"

      - name: Setup OHOS Flutter
        if: ${{ matrix.platform == 'ohos' }}
        shell: bash
        env:
          OHOS_FLUTTER_HOME: ${{ runner.temp }}/flutter/3.35.8-ohos-1.0.1
          OHOS_FLUTTER_GIT_URL: 'https://gitcode.com/CPF-Flutter/flutter_flutter.git'
          OHOS_FLUTTER_GIT_TAG: '3.35.8-ohos-1.0.1'
          OHOS_FLUTTER_GIT_COMMIT: 'a82fc2f1e07432b99713a508d2f9fc1a6c3873b1'
        run: |
          set -euo pipefail
          test -x "${OHOS_FLUTTER_HOME}/bin/flutter"
          test "$(git -C "${OHOS_FLUTTER_HOME}" rev-parse HEAD)" = "${OHOS_FLUTTER_GIT_COMMIT}"
          test "$(git -C "${OHOS_FLUTTER_HOME}" rev-list -n 1 "refs/tags/${OHOS_FLUTTER_GIT_TAG}")" = "${OHOS_FLUTTER_GIT_COMMIT}"
          if ! git -C "${OHOS_FLUTTER_HOME}" diff --quiet HEAD --; then
            echo "::error::Cached OHOS Flutter working tree does not match the pinned commit"
            git -C "${OHOS_FLUTTER_HOME}" status --short
            exit 1
          fi

          {
            echo "FLUTTER_HOME=${OHOS_FLUTTER_HOME}"
            echo "FLUTTER_HOME_BIN=${OHOS_FLUTTER_HOME}/bin"
            echo "PUB_CACHE=${OHOS_FLUTTER_HOME}/.pub-cache"
            echo "PUB_HOSTED_URL=https://pub.flutter-io.cn"
            echo "FLUTTER_STORAGE_BASE_URL=https://storage.flutter-io.cn"
            echo "FLUTTER_GIT_URL=${OHOS_FLUTTER_GIT_URL}"
            echo "FLUTTER_GIT_REF=${OHOS_FLUTTER_GIT_TAG}"
          } >> "${GITHUB_ENV}"
          echo "${OHOS_FLUTTER_HOME}/bin" >> "${GITHUB_PATH}"

      - name: Setup HarmonyOS CLI tools (API 24)
        id: setup-ohos
        if: ${{ matrix.platform == 'ohos' }}
        uses: ErBWs/setup-ohos@4dbb63025116eb6165ceac58a4bf47cbdc5ac721 # v2.0.0
        with:
          version: 6.1.1.280
          cache: true

      - name: Verify HarmonyOS SDK
        if: ${{ matrix.platform == 'ohos' }}
        shell: bash
        env:
          HARMONYOS_SDK_VERSION: ${{ steps.setup-ohos.outputs.sdk-version }}
          HARMONYOS_API_VERSION: ${{ steps.setup-ohos.outputs.api-version }}
        run: |
          if [ "${HARMONYOS_SDK_VERSION}" != "6.1.1.125" ]; then
            echo "::error::Expected HarmonyOS SDK 6.1.1.125, got ${HARMONYOS_SDK_VERSION}"
            exit 1
          fi
          if [ "${HARMONYOS_API_VERSION}" != "24" ]; then
            echo "::error::Expected HarmonyOS API 24, got ${HARMONYOS_API_VERSION}"
            exit 1
          fi

      - name: Setup signing key for OHOS
        if: ${{ matrix.platform == 'ohos' }}
        working-directory: example/ohos
        shell: bash
        env:
          DEFAULT_OHOS_SIGNING_MATERIAL_FILE: ${{ secrets.OHOS_SIGNING_MATERIAL_FILE }}
          DEFAULT_OHOS_SIGNING_P12_FILE: ${{ secrets.OHOS_SIGNING_P12 }}
          DEFAULT_OHOS_SIGNING_P12_PWD: ${{ secrets.OHOS_SIGNING_P12_PWD }}
          DEFAULT_OHOS_SIGNING_KEY_ALIAS: ${{ secrets.OHOS_SIGNING_KEY_ALIAS }}
          DEFAULT_OHOS_SIGNING_KEY_PWD: ${{ secrets.OHOS_SIGNING_KEY_PWD }}
          DEFAULT_OHOS_SIGNING_SIGN_ALG: ${{ secrets.OHOS_SIGNING_SIGN_ALG }}
          DEFAULT_OHOS_SIGNING_PROFILE: ${{ secrets.OHOS_SIGNING_PROFILE }}
          DEFAULT_OHOS_SIGNING_CER: ${{ secrets.OHOS_SIGNING_CER }}
        run: |
          signing_dir="$RUNNER_TEMP/signing"
          mkdir -p "${signing_dir}"

          material_path="${signing_dir}/material.zip"
          p12_path="${signing_dir}/agora_rtc_engine_example.p12"
          profile_path="${signing_dir}/agora_rtc_engine_example.p7b"
          cert_path="${signing_dir}/agora_rtc_engine_example.cer"

          printf '%s' "$DEFAULT_OHOS_SIGNING_MATERIAL_FILE" | base64 --decode --output "${material_path}"
          printf '%s' "$DEFAULT_OHOS_SIGNING_P12_FILE" | base64 --decode --output "${p12_path}"
          printf '%s' "$DEFAULT_OHOS_SIGNING_PROFILE" | base64 --decode --output "${profile_path}"
          printf '%s' "$DEFAULT_OHOS_SIGNING_CER" | base64 --decode --output "${cert_path}"
          unzip -oq "${material_path}" -d "${signing_dir}"

          DEFAULT_OHOS_SIGNING_P12_FILE_PATH="${p12_path}" \
          DEFAULT_OHOS_SIGNING_PROFILE_PATH="${profile_path}" \
          DEFAULT_OHOS_SIGNING_CER_PATH="${cert_path}" \
          node <<'NODE'
          const fs = require('fs');
          const profilePath = 'build-profile.json5';
          const profile = JSON.parse(fs.readFileSync(profilePath, 'utf8'));
          profile.app.signingConfigs = [
            {
              name: 'default',
              type: 'HarmonyOS',
              material: {
                storeFile: process.env.DEFAULT_OHOS_SIGNING_P12_FILE_PATH,
                storePassword: process.env.DEFAULT_OHOS_SIGNING_P12_PWD,
                keyAlias: process.env.DEFAULT_OHOS_SIGNING_KEY_ALIAS,
                keyPassword: process.env.DEFAULT_OHOS_SIGNING_KEY_PWD,
                signAlg: process.env.DEFAULT_OHOS_SIGNING_SIGN_ALG,
                profile: process.env.DEFAULT_OHOS_SIGNING_PROFILE_PATH,
                certpath: process.env.DEFAULT_OHOS_SIGNING_CER_PATH,
              },
            },
          ];
          fs.writeFileSync(profilePath, `${JSON.stringify(profile, null, 2)}\n`);
          NODE

      - name: Build
        env:
          DEFAULT_BUILD_APP_ID: ${{ secrets.APP_ID }}
        shell: bash
        working-directory: example
        run: |
          # show flutter version
          flutter --version && which flutter

          # install dependencies
          flutter pub get

          # prepare build command, android: apk, ios: ipa, macos: macos, windows: (empty), web: web
          build_command=""
                    
          if [ "$platform" == "web" ]; then
             filtered_extra_build_arguments="${extra_build_arguments//--debug/}"
             filtered_extra_build_arguments="${filtered_extra_build_arguments//--profile/}"
             filtered_extra_build_arguments="${filtered_extra_build_arguments//--release/}"
             filtered_extra_build_arguments=$(echo "$filtered_extra_build_arguments" | sed 's/  */ /g' | sed 's/^ *//;s/ *$//')
          elif [ "$platform" == "ios" ]; then
             if [[ "$extra_build_arguments" == *"--debug"* ]]; then
               filtered_extra_build_arguments="${extra_build_arguments//--debug/--Profile}"
             else
               filtered_extra_build_arguments="$extra_build_arguments"
             fi
          else
             filtered_extra_build_arguments="$extra_build_arguments"
          fi

          if [ "$platform" == "android" ]; then
            build_command="flutter build apk"
          elif [ "$platform" == "ios" ]; then
            build_command="flutter build ipa"
          elif [ "$platform" == "macos" ]; then
            build_command="flutter build macos"
          elif [ "$platform" == "windows" ]; then
            build_command="flutter build windows"
          elif [ "$platform" == "web" ]; then
            build_command="flutter build web"
          elif [ "$platform" == "ohos" ]; then
            build_command="flutter build hap"
          fi

          # prepare build options
          build_options=""

          # append extra build options
          if [ -n "$extra_build_options" ]; then
            build_options="$build_options $extra_build_options"
          fi

          # prepare default build arguments, if current platform is web, set DEFAULT_BUILD_APP_ID to empty string
          if [ "$platform" == "web" ]; then
            DEFAULT_BUILD_APP_ID=""
          fi

          build_arguments="--dart-define=TEST_APP_ID=$DEFAULT_BUILD_APP_ID --dart-define=TEST_TOKEN="" --dart-define=TEST_CHANNEL_ID="testapi" --dart-define=INTERNAL_TESTING=true"

          # append extra build arguments
          if [ -n "$filtered_extra_build_arguments" ]; then
            build_arguments="$build_arguments $filtered_extra_build_arguments"
          fi

          # append build arguments for ios
          if [ "$platform" == "ios" ]; then
            build_arguments="--export-options-plist ios/export.plist $build_arguments"
          fi

          echo "========================================="
          echo "🔨 Building for platform: $platform"
          echo "🚀 Command: $build_command $build_options $build_arguments"
          echo "========================================="

          # run build command
          $build_command $build_options $build_arguments

          # create output directory if it doesn't exist
          if [ ! -d "../output" ]; then
            mkdir -p ../output
          fi

          # copy build result to output directory by different platforms
          if [ "$platform" == "android" ]; then
            # copy files in build/app/outputs/flutter-apk directory to ../output directory
            cp build/app/outputs/flutter-apk/* ../output

            # copy whole symbol directory to ../output directory if it exists
            if [ -d "build/app/outputs/native-debug-symbols" ]; then
              cp -r build/app/outputs/native-debug-symbols ../output
            fi
          elif [ "$platform" == "ios" ]; then
            # copy build/ios/ipa/agora_rtc_engine_example.ipa to ../output directory
            cp build/ios/ipa/agora_rtc_engine_example.ipa ../output

            if [ -d "build/ios/archive/Runner.xcarchive/dSYMs" ]; then
              cp -RP build/ios/archive/Runner.xcarchive/dSYMs ../output
            fi
          elif [ "$platform" == "macos" ]; then
            # cp example/build/macos/Build/Products/*/agora_rtc_engine_example.app to ../output directory
            cp -RP build/macos/Build/Products/*/agora_rtc_engine_example.app ../output

            # mkdir dSYMs directory in ../output directory if it doesn't exist
            if [ ! -d "../output/dSYMs" ]; then
              mkdir -p ../output/dSYMs
            fi

            # copy all dSYM files from example/build/macos/Build/Products and subdirectories to ../output/dSYMs directory
            cp -RP build/macos/Build/Products/**/*.dSYM ../output/dSYMs
          elif [ "$platform" == "windows" ]; then
            # since flutter have no plain to support to build to run on 32-bit windows, we only need concern about the 64-bit windows
            
            # copy whole build/windows/x64/runner/Release directory to ../output if the directory exists
            if [ -d "build/windows/x64/runner/Release" ]; then
              cp -r build/windows/x64/runner/Release ../output

              # copy all pdb files in build/windows/x64/plugins/**/Release/ to ../output/Release
              cp -r build/windows/x64/plugins/**/Release/*.pdb ../output/Release
            fi

            # copy whole build/windows/x64/runner/Debug directory to ../output if the directory exists
            if [ -d "build/windows/x64/runner/Debug" ]; then
              cp -r build/windows/x64/runner/Debug ../output

              # copy all pdb files in build/windows/x64/plugins/**/Debug/ to ../output/Debug
              cp -r build/windows/x64/plugins/**/Debug/*.pdb ../output/Debug
            fi

            if [ -d "build/windows/x64/runner/Profile" ]; then
              cp -r build/windows/x64/runner/Profile ../output

              # copy all pdb files in build/windows/x64/plugins/**/Profile/ to ../output/Profile
              cp -r build/windows/x64/plugins/**/Profile/*.pdb ../output/Profile
            fi
          elif [ "$platform" == "web" ]; then
            # copy all files and files in subdirectories to ../output directory
            cp -r build/web/* ../output
          elif [ "$platform" == "ohos" ]; then
            signed_hap=$(find build/ohos/hap -maxdepth 1 -type f -name '*-signed.hap' -print -quit)
            if [ -z "${signed_hap}" ]; then
              echo "Signed OHOS HAP was not generated" >&2
              exit 1
            fi
            cp "${signed_hap}" ../output
          fi

      - name: Generate artifact name
        id: generate_artifact_name
        shell: bash
        run: |
          # get pub_version from pubspec.yaml
          pub_version=$(grep 'version: ' pubspec.yaml | sed -e 's,.*: \(.*\),\1,')
          
          # get build_timestamp
          build_timestamp=$(date +%Y%m%d%H%M%S)

          # generate artifact_name
          artifact_name="agora_rtc_engine_example_${{ matrix.platform }}_${pub_version}_${build_timestamp}_${{ github.run_id }}"
          echo "artifact_name=$artifact_name" >> $GITHUB_OUTPUT

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.generate_artifact_name.outputs.artifact_name }}
          path: output
          if-no-files-found: error

      - name: Setup download url
        id: setup_output
        shell: bash
        run: |
          # see https://docs.github.com/en/actions/writing-workflows/choosing-what-your-workflow-does/passing-information-between-jobs
          current_platform="${{ matrix.platform }}"
          echo "artifact_nightly_link_${current_platform}=https://nightly.link/${{ github.repository }}/actions/runs/${{ github.run_id }}/${{ steps.generate_artifact_name.outputs.artifact_name }}.zip" >> $GITHUB_OUTPUT

